<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동 세션 · 최종 3</title>
<style>
:root{
  --field:#2B2836; --panel:#353143; --panel2:#3E3A4D; --line:#4B4659;
  --chalk:#F1EDE6; --dim:#C6C0D4; --faint:#ABA4C2;
  --brass:#E0A83C; --slate:#8496AE; --alarm:#E4643E; --ok:#6FAE8F;
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono','Roboto Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--field);color:var(--chalk);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;padding:16px 12px calc(170px + env(safe-area-inset-bottom))}
.wrap{max-width:500px;margin:0 auto}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-weight:600}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700}

.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.top .date{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.05em;font-weight:600}

/* ── 총정리 ── */
.overview{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 15px;margin-bottom:13px}
.overview > .eyebrow{display:block;margin-bottom:5px}
.ovnote{font-size:13px;color:var(--dim);line-height:1.55;margin-bottom:15px}
.ovnote b{color:var(--chalk);font-weight:700}
.dayrow{display:block;width:100%;text-align:left;color:var(--chalk);font-family:var(--sans);
  background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.dayrow:last-of-type{margin-bottom:0}
.dayrow[data-sel="1"]{border-color:var(--brass);border-left-color:var(--brass);background:#443E58}
.dayrow[data-next="1"] .dnum::after{content:"다음";font-family:var(--sans);font-size:10px;font-weight:700;
  background:var(--brass);color:#2B2836;padding:2px 7px;border-radius:20px;margin-left:8px;letter-spacing:0}
.dayrow:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.drhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dnum{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--brass);letter-spacing:.06em;display:flex;align-items:center}
.dsets{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:600;white-space:nowrap}
.dtitle{font-size:17.5px;font-weight:800;letter-spacing:-.02em;margin-top:5px;color:var(--chalk)}
.dlist{font-size:13px;color:#CFC9DC;margin-top:6px;line-height:1.5}
.dlist em{font-style:normal;color:var(--brass)}
.dleg{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:7px;font-weight:600}

/* ── 브리핑 ── */
.brief{background:var(--panel2);border:1px solid var(--brass);border-radius:16px;padding:19px 17px;margin-bottom:13px}
.brief h1{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.brief h1 span{color:var(--brass)}
.brief .focus{font-size:14.5px;color:var(--dim);margin-top:10px;line-height:1.5}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:11px;overflow:hidden;margin-top:15px}
.fact{background:var(--panel);padding:12px 8px;text-align:center}
.fact .fv{font-family:var(--mono);font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1}
.fact .fk{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:6px;font-weight:700}
.runline{margin-top:13px;padding:12px 13px;border-radius:10px;font-size:13.5px;line-height:1.45;
  background:rgba(132,150,174,.14);border:1px solid rgba(132,150,174,.3)}
.runline.warn{background:rgba(228,100,62,.13);border-color:rgba(228,100,62,.34)}
.runline b{font-weight:700}
.prev{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:11px;font-weight:600}

.banner{background:rgba(228,100,62,.13);border:1px solid rgba(228,100,62,.4);border-radius:14px;
  padding:15px 15px 13px;margin-bottom:13px}
.banner .bt{font-size:15px;font-weight:800;color:var(--alarm);letter-spacing:-.01em}
.banner .bd{font-size:13.5px;color:var(--chalk);margin-top:7px;line-height:1.55}
.banner .bd b{color:var(--brass)}
.banner button{margin-top:11px;background:var(--panel2);border:1px solid var(--line);color:var(--chalk);
  font-family:var(--sans);font-size:13px;font-weight:700;padding:11px 14px;border-radius:10px;
  cursor:pointer;min-height:44px}
.restore{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px}
.restore summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--dim);list-style:none;
  display:flex;justify-content:space-between;align-items:center}
.restore summary::-webkit-details-marker{display:none}
.restore summary::after{content:"+";font-family:var(--mono);font-size:17px;color:var(--faint)}
.restore[open] summary::after{content:"\2212"}
.restore summary:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
.restore textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--chalk);font-family:var(--mono);font-size:13px;line-height:1.55;padding:12px;
  margin:12px 0 10px;resize:vertical}
.block{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px 15px;margin-bottom:13px}
.block > .eyebrow{display:block;margin-bottom:12px}
.block.warn{border-color:rgba(228,100,62,.5)}
.bitem{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:center;
  padding:11px 0;border-top:1px solid var(--line)}
.bitem:first-of-type{border-top:0;padding-top:2px}
.bname{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.bdetail{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.4}
.bdetail.alert{color:var(--alarm)}
.btime{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);
  color:var(--brass);font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.btime[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#2B2836}
.btime.nostart{color:var(--faint);cursor:default}
.btime:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.prog{display:flex;align-items:center;gap:11px;margin-bottom:16px;padding:0 2px}
.bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:3px;transition:width .3s ease;width:0}
.prog .c{font-family:var(--mono);font-size:13px;color:var(--dim);white-space:nowrap;font-weight:600}
.unsaved{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--alarm);
  border:1px solid rgba(228,100,62,.45);background:rgba(228,100,62,.13);
  padding:3px 8px;border-radius:20px;white-space:nowrap}

.ex{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px 15px 14px;margin-bottom:11px;scroll-margin-top:14px}
.ex.done{opacity:.45}
.ex.active{border-color:var(--brass);box-shadow:0 0 0 1px rgba(224,168,60,.25)}
.tagline{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px}
.tag.big{background:rgba(224,168,60,.18);color:var(--brass);border:1px solid rgba(224,168,60,.4)}
.tag.arm{background:rgba(111,174,143,.16);color:var(--ok);border:1px solid rgba(111,174,143,.4)}
.tag.acc{background:rgba(132,150,174,.14);color:var(--slate);border:1px solid rgba(132,150,174,.32)}
.tag.free{background:var(--chalk);color:#2B2836;border:1px solid var(--chalk)}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exname{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.exname .swapped{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.06em;display:block;margin-top:5px;font-weight:600}
.extarget{font-family:var(--mono);font-size:14px;color:var(--brass);margin-top:7px;font-weight:700}
.cue{font-size:13.5px;color:var(--dim);margin-top:7px;line-height:1.45}
.idx{font-family:var(--mono);font-size:13px;color:var(--faint);font-weight:700;padding-top:3px}
.last{font-family:var(--mono);font-size:13px;color:var(--faint);margin-top:8px;font-weight:600}
.keep{display:inline-block;background:rgba(132,150,174,.16);border:1px solid rgba(132,150,174,.4);
  color:var(--slate);font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 10px;
  border-radius:20px;margin-top:9px}
.up{display:inline-block;background:rgba(111,174,143,.18);border:1px solid rgba(111,174,143,.45);
  color:var(--ok);font-family:var(--mono);font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:20px;margin-top:9px}

.sets{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.set,.setlabels{display:grid;grid-template-columns:26px 1fr 1fr 62px;gap:8px;align-items:center}
.setlabels span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center;font-weight:700}
.set .sn{font-family:var(--mono);font-size:15px;color:var(--dim);text-align:center;font-weight:700}
.set input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--chalk);font-family:var(--mono);font-size:21px;font-weight:700;text-align:center;
  padding:13px 4px;min-height:54px;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--faint);font-weight:500;font-size:15px}
.set input:focus{outline:none;border-color:var(--brass);background:#46415A}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set input[type=number]{-moz-appearance:textfield}
.set input.ghost{color:var(--dim);font-style:italic}
/* 반복 없이 ✓ 를 눌렀을 때 — 어느 칸을 채워야 하는지 눈으로 잡아준다 */
.set input.need{border-color:var(--alarm);background:#4A3630;animation:needshake .3s}
@keyframes needshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.set input.need{animation:none}}
.chk{min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--faint);
  transition:background .15s,color .15s,border-color .15s}
.chk[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#2B2836}
.chk:focus-visible,.swapbtn:focus-visible,.alt:focus-visible,.morebtn:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

.swapbtn{margin-top:13px;width:100%;background:transparent;border:1px dashed var(--line);color:var(--dim);
  font-family:var(--sans);font-size:14px;font-weight:600;padding:12px;border-radius:10px;cursor:pointer;min-height:46px}
.swapbtn:active{background:var(--panel2)}
.alts{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.alt{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:10px;padding:13px 14px;cursor:pointer;min-height:52px}
.alt:active{background:var(--line)}
.alt.ai{border-left-color:var(--ok)}
.alt .an{font-size:16px;font-weight:700}
.alt .aw{font-size:13.5px;color:var(--dim);margin-top:4px;line-height:1.45}
.morebtn{width:100%;background:transparent;border:1px solid var(--line);color:var(--dim);
  font-family:var(--sans);font-size:13px;font-weight:600;padding:11px;border-radius:10px;cursor:pointer;min-height:44px}
.morebtn[disabled]{color:var(--faint);cursor:default}
.revert{background:none;border:0;color:var(--faint);font-family:var(--sans);font-size:12.5px;
  text-decoration:underline;cursor:pointer;padding:8px 0;margin-top:4px}

.rest{position:fixed;left:0;right:0;bottom:0;background:var(--panel2);border-top:1px solid var(--line);
  padding:15px 14px calc(15px + env(safe-area-inset-bottom));transform:translateY(115%);
  transition:transform .28s cubic-bezier(.2,.8,.3,1);z-index:20}
.rest.on{transform:none}
.rest .line{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.rest .line i{display:block;height:100%;background:var(--brass);width:100%}
.rest .row{display:flex;align-items:center;gap:12px}
.rest .t{font-family:var(--mono);font-size:38px;font-weight:800;letter-spacing:-.045em;min-width:108px;line-height:1}
.rest .t.over{color:var(--ok)}
.rest .meta{flex:1;font-size:13px;color:var(--dim);line-height:1.35}
.rest .meta b{color:var(--chalk);display:block;font-size:15px;font-weight:700}
.rest button{background:var(--panel);border:1px solid var(--line);color:var(--chalk);font-family:var(--mono);
  font-size:13.5px;font-weight:700;padding:12px 13px;border-radius:10px;cursor:pointer;min-height:50px}
.rest button:active{background:var(--line)}

.finish{width:100%;background:var(--brass);color:#2B2836;border:0;border-radius:14px;padding:19px;
  font-family:var(--sans);font-size:17px;font-weight:800;cursor:pointer;letter-spacing:-.01em}
.finish:disabled{background:var(--panel);color:var(--faint);cursor:default}
.saved{text-align:center;font-family:var(--mono);font-size:13px;color:var(--ok);margin-top:12px;min-height:18px;font-weight:600}

.coach{margin-top:13px;background:var(--panel);border:1px solid var(--brass);border-radius:15px;padding:17px 15px}
.coach .eyebrow{color:var(--brass);display:block;margin-bottom:12px}
.coachbtn{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--chalk);
  font-family:var(--sans);font-size:15px;font-weight:700;padding:16px;border-radius:12px;cursor:pointer;min-height:52px}
.coachbtn:active{background:var(--line)}
.coachbtn[disabled]{color:var(--faint);cursor:default}
.coachout{margin-top:14px;font-size:15px;line-height:1.7;white-space:pre-wrap}
.coachout:empty{display:none}
.err{color:var(--alarm);font-size:13px;line-height:1.55;margin-top:9px}
.dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}
.env{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:18px;font-family:var(--mono);font-size:11.5px;font-weight:600}
.env .y{color:var(--ok)} .env .n{color:var(--faint)}
#backup textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--chalk);font-family:var(--mono);font-size:13px;line-height:1.6;padding:12px;margin-bottom:10px;resize:vertical}
#diagout{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--chalk);
  font-family:var(--mono);font-size:12px;line-height:1.65;padding:12px;margin-top:11px;
  white-space:pre-wrap;word-break:break-all;display:none}
#diagout.on{display:block}
.okline{color:var(--ok);font-size:13.5px;font-weight:700;line-height:1.5;margin:4px 0 10px}
.okline b{color:var(--brass)}
.rgroup{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.rgt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--brass);font-weight:700;margin-bottom:7px}
.rgi{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;color:var(--dim)}
.rgv{font-family:var(--mono);color:var(--chalk);white-space:nowrap;font-weight:600}
.rgv b{color:var(--ok)}
.hasrec{color:var(--ok)}
.bakhint{font-size:12.5px;color:var(--faint);margin-top:9px;line-height:1.5}
.hint{font-size:13px;color:var(--faint);text-align:center;margin-top:10px;line-height:1.7}
.hint b{color:var(--brass)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="eyebrow">Day 순환 프로그램</span><span class="date" id="today"></span></div>
  <div class="banner" id="banner" style="display:none"></div>
  <details class="restore" id="restorebox">
    <summary>지난 기록 불러오기 · 백업 텍스트 붙여넣기</summary>
    <button class="coachbtn" id="clipload">클립보드에서 한 번에 불러오기</button>
    <textarea id="restext" rows="4" placeholder="자동이 안 되면 여기에 직접 붙여넣으세요"></textarea>
    <button class="coachbtn" id="resbtn">붙여넣은 내용 불러오기</button>
    <div class="bakhint" id="resmsg">저장이 안 되는 환경이면 이 방법으로 지난 중량을 이어갈 수 있습니다.</div>
  </details>
  <section class="overview" id="overview"></section>
  <section class="brief" id="brief"></section>
  <section class="block" id="warmup"></section>
  <div class="prog"><div class="bar"><i id="bar"></i></div><span class="c" id="count">0 / 0 세트</span><span class="unsaved" id="unsaved" style="display:none">미저장</span></div>
  <div id="list"></div>
  <section class="block" id="finisher"></section>
  <button class="finish" id="finish" disabled>세션 저장</button>
  <div class="saved" id="saved"></div>
  <section class="block" id="backup" style="display:none"></section>
  <section class="coach">
    <span class="eyebrow">세션 코치</span>
    <button class="coachbtn" id="review">오늘 기록 보고 다음 세션 조정받기</button>
    <div class="coachout" id="reviewout"></div>
  </section>
  <div class="env" id="env"></div>
  <p class="hint">세션이 끝나면 <b>한 번에 복사하기</b>를 꼭 누르세요.<br>그 텍스트 하나에 누적 기록이 전부 들어 있습니다.</p>
</div>

<div class="rest" id="rest">
  <div class="line"><i id="restline"></i></div>
  <div class="row">
    <span class="t n" id="resttime">0:00</span>
    <span class="meta"><b id="restname">휴식</b><span id="restnext"></span></span>
    <button id="plus30">+30s</button><button id="skip">건너뛰기</button>
  </div>
</div>

<script>
/* [이름,세트,반복,상단,RIR,휴식초,부위,큐,중량모드,분류,대체,증량kg,장비] */
const DAYS = [
 {n:1,title:"상체 밀기",sub:"가슴 · 어깨 · 삼두",leg:false,
  warmup:[["폼롤러","흉추 · 광배 · 가슴 각 1분씩",300],
          ["트레드밀 걷기","경사 4% · 시속 5~6km",420],
          ["첫 종목 워밍업 세트","본세트 무게의 50%로 10회 × 2세트",0]],
  finish:{name:"천국의 계단",detail:"낮은 단계로 12분 · 대화 가능한 강도",sec:720,warn:false},
  focus:"덤벨 벤치프레스로 시작해 견갑 안정근부터 깨우고, 나머지 볼륨은 머신으로 안전하게 채웁니다.",

const KEY="workout-log", DRAFT="workout-draft", DOW=["일","월","화","수","목","금","토"];

const pad=n=>String(n).padStart(2,"0");
function localDate(d){ d=d||new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const $=id=>document.getElementById(id), today=()=>localDate();
let store={history:[],last:{}}, curDay=1, entries={}, swaps={}, blocks={}, wl=null, actx=null;
const D=()=>DAYS[curDay-1];

async function load(){
  try{ const r=await window.storage.get(KEY,false); if(r&&r.value) store=JSON.parse(r.value); }catch(e){}
  store.history=store.history||[]; store.last=store.last||{};
  curDay=nextDay();
}
function nextDay(){ const last=store.history[0]; return last&&last.day ? (last.day % DAYS.length)+1 : 1; }
let lastErr="", dirty=false, storageOK=null;
function saveDraft(){ dirty=true; markUnsaved(); }   // 저장하지 않음 — 세션 저장 때 한 번에
function markUnsaved(){
  const el=$("unsaved"); if(!el) return;
  el.textContent = dirty ? "미저장" : "";
  el.style.display = dirty ? "inline-block" : "none";
}
async function setRetry(key,val,tries){
  tries=tries||3;
  for(let a=0;a<tries;a++){
    try{ await window.storage.set(key,val,false); return {ok:true}; }
    catch(e){
      lastErr=e&&e.message?e.message:String(e);
      if(a<tries-1) await new Promise(r=>setTimeout(r,800*(a+1)));
    }
  }
  return {ok:false,err:lastErr};
}
async function keepAwake(){ try{ if("wakeLock" in navigator && !wl){ wl=await navigator.wakeLock.request("screen"); wl.addEventListener("release",()=>{wl=null;}); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") keepAwake(); });
window.addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue="기록이 아직 저장되지 않았습니다."; } });
function armAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(){ try{ if(!actx) return; [0,0.18].forEach(t=>{
  const o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=880;
  g.gain.setValueAtTime(0.0001,actx.currentTime+t);
  g.gain.exponentialRampToValueAtTime(0.35,actx.currentTime+t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+0.14);
  o.connect(g);g.connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.16); }); }catch(e){} }

async function ask(prompt){
  let res;
  try{ res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
  }catch(e){ throw new Error("네트워크에 닿지 못했습니다"); }
  if(!res.ok) throw new Error(`서버 응답 ${res.status}`);
  const data=await res.json();
  if(data.error) throw new Error(data.error.message||"API 오류");
  const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  if(!txt) throw new Error("빈 응답");
  return txt;
}

/* ── 브리핑 ── */
function renderBrief(){
  const d=D();
  const sets=d.ex.reduce((a,e)=>a+e[1],0);
  const lift=d.ex.reduce((a,e)=>a+e[1]*(e[5]+45),0)/60;
  const extra=d.warmup.reduce((a,w)=>a+w[2],0)/60+4+d.finish.sec/60;
  const mins=Math.round((lift+extra)/5)*5;
  const prev=store.history.find(h=>h.day===d.n);
  let prevTxt="이 Day는 처음입니다 — 오늘 기록이 다음 기준이 됩니다";
  if(prev){ const days=Math.round((new Date(today())-new Date(prev.date))/86400000);
    prevTxt=`마지막 수행 · ${prev.date} (${days===0?"오늘":days+"일 전"})`; }
  $("brief").innerHTML=`
    <h1><span>DAY ${d.n}</span> · ${d.title}</h1>
    <div class="focus">${d.focus}</div>
    <div class="facts">
      <div class="fact"><div class="fv">${d.ex.length}</div><div class="fk">종목</div></div>
      <div class="fact"><div class="fv">${sets}</div><div class="fk">세트</div></div>
      <div class="fact"><div class="fv">~${mins}</div><div class="fk">분 · 웜업포함</div></div>
    </div>
    <div class="runline ${d.leg?"warn":""}">
      ${d.leg?"<b>오늘 밤 러닝은 낮춥니다 — </b>":"<b>오늘 밤 러닝 · </b>"}${d.run}${d.leg?". 하체 직후 평소 페이스로 뛰면 폼이 무너집니다.":""}
    </div>
    <div class="prev">${prevTxt}</div>`;
}

function blockItem(kind,idx,name,detail,sec,alert){
  const done=(blocks[kind]||{})[idx];
  const label = sec>0 ? Math.round(sec/60)+"분" : "완료";
  return `<div class="bitem">
    <div><div class="bname">${name}</div><div class="bdetail ${alert?"alert":""}">${detail}</div></div>
    <div class="btime ${sec>0?"":"nostart"}" role="button" tabindex="0" aria-pressed="${!!done}"
         data-k="${kind}" data-i="${idx}" data-sec="${sec}" data-name="${name}" aria-label="${name} 완료">${done?"✓":label}</div>
  </div>`;
}
function renderBlocks(){
  const d=D();
  $("warmup").innerHTML='<span class="eyebrow">웜업 · 약 '+Math.round(d.warmup.reduce((a,w)=>a+w[2],0)/60+4)+'분</span>'
    + d.warmup.map((w,i)=>blockItem("w",i,w[0],w[1],w[2],false)).join("");
  const f=d.finish;
  $("finisher").className="block"+(f.warn?" warn":"");
  $("finisher").innerHTML='<span class="eyebrow">마무리 유산소</span>'+blockItem("f",0,f.name,f.detail,f.sec,f.warn);
  document.querySelectorAll(".btime").forEach(b=>{
    const go=()=>{
      const k=b.dataset.k,i=b.dataset.i,sec=+b.dataset.sec;
      blocks[k]=blocks[k]||{};
      const on=!blocks[k][i]; blocks[k][i]=on;
      saveDraft(); keepAwake(); armAudio();
      if(on&&sec>0) startTimer(sec,b.dataset.name,k==="w"?"웜업 진행 중":"마무리 유산소");
      else stopRest();
      renderBlocks();
    };
    b.addEventListener("click",go);
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  });
}
function startTimer(sec,name,note){
  span=sec;left=sec;
  $("restname").textContent=name; $("restnext").textContent=note;
  $("rest").classList.add("on");
  clearInterval(timer);tick();timer=setInterval(tick,1000);
}
const nameOf=i=>swaps[i]||D().ex[i][0];
const setsDone=i=>(entries[i]||[]).filter(x=>x&&x.done).length;
function activeIdx(){ const ex=D().ex; for(let i=0;i<ex.length;i++) if(setsDone(i)<ex[i][1]) return i; return -1; }

function render(){
  const act=activeIdx();
  $("list").innerHTML=D().ex.map((e,i)=>{
    const [orig,sets,reps,top,rir,rest,target,cue,wmode,kind,alts,inc,equip]=e;
    const name=nameOf(i), l=store.last[name], up=!!(l&&l.allTop&&l.w>0), bw=wmode==="맨몸";
    const first=(entries[i]&&entries[i][0])||{};
    const eqTag = equip==="프리"?`<span class="tag free">프리웨이트</span>`
                : equip==="맨몸"?`<span class="tag free">맨몸</span>`:``;
    const tag = eqTag + (kind==="대근육"?`<span class="tag big">대근육</span>`
              : kind==="팔"?`<span class="tag arm">팔</span>`
              : `<span class="tag acc">보조</span>`);
    const rows=Array.from({length:sets},(_,s)=>{
      const v=(entries[i]&&entries[i][s])||{};
      let pw=v.w,gw=false;
      if(pw===undefined){
        if(s>0&&first.w!==undefined){pw=first.w;gw=true;}            // 이번 세션 1세트 값 따라가기
        else if(l){pw=up?+(l.w+(inc||2.5)).toFixed(1):l.w;gw=true;}  // 지난 기록 → 전 세트에 채움
      }
      let pr=v.r,gr=false;
      if(pr===undefined&&s>0&&first.r!==undefined){pr=first.r;gr=true;}
      return `<div class="set"><span class="sn">${s+1}</span>
        <input type="number" inputmode="decimal" step="0.5" placeholder="${bw?"—":"kg"}" class="${gw?"ghost":""}" ${bw?"disabled":""}
          value="${bw||pw===undefined||pw===0?"":pw}" data-i="${i}" data-s="${s}" data-f="w" aria-label="${name} ${s+1}세트 중량">
        <input type="number" inputmode="numeric" placeholder="회" class="${gr?"ghost":""}"
          value="${pr===undefined?"":pr}" data-i="${i}" data-s="${s}" data-f="r" aria-label="${name} ${s+1}세트 반복">
        <div class="chk" role="button" tabindex="0" aria-pressed="${!!v.done}" data-i="${i}" data-s="${s}" data-rest="${rest}" aria-label="${s+1}세트 완료">✓</div></div>`;
    }).join("");
    return `<section class="ex ${setsDone(i)===sets?"done":""} ${i===act?"active":""}" id="ex-${i}">
      <div class="tagline">${tag}<span class="tag acc">${target}</span></div>
      <div class="exhead"><div>
        <div class="exname">${name}${swaps[i]?`<span class="swapped">대체 · 원래 ${orig}</span>`:""}</div>
        <div class="extarget">${sets} × ${reps}회 · RIR ${rir} · 휴식 ${rest>=60?(rest/60)+"분":rest+"초"}</div>
        <div class="cue">${cue}</div>
      </div><span class="idx">${String(i+1).padStart(2,"0")}</span></div>
      <div class="last">${l?`지난 기록 · ${l.w>0?l.w+"kg × ":""}${l.reps.join(", ")}회`:"지난 기록 없음 — 가볍게 시작"}</div>
      ${up?`<span class="up">↑ 다음 중량 +${inc||2.5}kg</span>`:(l&&l.w>0?`<span class="keep">지난 중량 유지 · 반복 수를 늘려보세요</span>`:"")}
      <div class="setlabels"><span></span><span>${bw?"맨몸":wmode}${l?" · 제안":""}</span><span>반복</span><span>완료</span></div>
      <div class="sets">${rows}</div>
      ${swaps[i]?`<button class="revert" data-rev="${i}">원래 종목으로 되돌리기</button>`
                :`<button class="swapbtn" data-i="${i}">기구가 차 있어요 — 대체 종목</button>`}
      <div class="alts" id="alts-${i}"></div>
    </section>`;
  }).join("");
  bind(); updateProgress();
}

function bind(){
  $("list").querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("focus",()=>{inp.classList.remove("ghost");keepAwake();armAudio();});
    inp.addEventListener("input",()=>{
      const {i,s,f}=inp.dataset;
      entries[i]=entries[i]||[]; entries[i][s]=entries[i][s]||{};
      entries[i][s][f]=inp.value===""?undefined:+inp.value;
      inp.classList.remove("ghost"); saveDraft();
    });
  });
  $("list").querySelectorAll(".chk").forEach(btn=>{
    const go=()=>{
      const i=+btn.dataset.i,s=+btn.dataset.s,rest=+btn.dataset.rest;
      entries[i]=entries[i]||[]; entries[i][s]=entries[i][s]||{};
      const setEl=btn.closest(".set");
      // 반복 없이 완료하면 저장 때 그 세트가 조용히 버려진다 (filter(x=>x.done&&x.r)).
      // 45분 뒤 저장 시점에 경고하면 늦다 — 켜지는 순간 막고 반복 칸으로 보낸다.
      // 끄는 동작은 막지 않는다. 안 그러면 잘못 켠 세트를 되돌릴 수 없다.
      const rInp=setEl.querySelector('input[data-f="r"]');
      if(!entries[i][s].done && rInp && !(+rInp.value>0)){
        rInp.classList.remove("ghost","need"); void rInp.offsetWidth;   // 연타해도 애니메이션이 다시 돈다
        rInp.classList.add("need"); rInp.focus(); rInp.select();
        setTimeout(()=>rInp.classList.remove("need"),1200);
        return;
      }
      setEl.querySelectorAll("input").forEach(inp=>{
        if(inp.value!==""&&!inp.disabled) entries[i][s][inp.dataset.f]=+inp.value; });
      const on=!entries[i][s].done; entries[i][s].done=on;
      saveDraft(); keepAwake(); armAudio();
      const fin=on&&setsDone(i)===D().ex[i][1];
      if(on) startRest(rest,nameOf(i),i,s); else stopRest();
      render();
      if(fin){ const nx=$("ex-"+(i+1)); if(nx) setTimeout(()=>nx.scrollIntoView({behavior:"smooth",block:"start"}),260); }
    };
    btn.addEventListener("click",go);
    btn.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  });
  $("list").querySelectorAll(".swapbtn").forEach(b=>b.addEventListener("click",()=>showAlts(+b.dataset.i)));
  $("list").querySelectorAll(".revert").forEach(b=>b.addEventListener("click",()=>{ delete swaps[b.dataset.rev]; saveDraft(); render(); }));
}

function altCard(name,why,ai){
  return `<div class="alt ${ai?"ai":""}" role="button" tabindex="0" data-name="${String(name).replace(/"/g,"")}">
    <div class="an">${name}</div><div class="aw">${why}</div></div>`;
}
function showAlts(i){
  const box=$("alts-"+i), local=D().ex[i][10]||[];
  box.innerHTML=local.map(a=>altCard(a[0],a[1],false)).join("")+`<button class="morebtn" data-i="${i}">다른 대안 더 찾기</button>`;
  bindAlts(i);
}
function bindAlts(i){
  const box=$("alts-"+i);
  box.querySelectorAll(".alt").forEach(el=>{
    const pick=()=>{ swaps[i]=el.dataset.name; saveDraft(); render(); };
    el.addEventListener("click",pick);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}});
  });
  const more=box.querySelector(".morebtn");
  if(more) more.addEventListener("click",()=>moreAlts(i,more));
}
async function moreAlts(i,btn){
  const e=D().ex[i], known=(e[10]||[]).map(a=>a[0]).join(", ");
  btn.disabled=true; btn.innerHTML='찾는 중<span class="dots"></span>';
  try{
    const out=await ask(
`일반 헬스장에서 "${nameOf(i)}"(주 자극 부위: ${e[6]})를 하려는데 기구가 사용 중이다.
이미 알고 있는 대안은 ${known}. 이것 말고 다른 대체 종목 2개를 골라라.

사용자 상황: ${CONTEXT}
목표: ${e[1]}세트 × ${e[2]}회, RIR ${e[4]}
조건: 흔한 헬스장에 반드시 있는 기구·덤벨·케이블·맨몸으로 가능할 것. 부하나 부상 위험이 원래보다 크게 오르지 않을 것.

정확히 2줄로만 답하라. 번호, 기호, 서두, 설명 금지.
종목명 | 대체가 되는 이유 25자 이내`);
    const parsed=out.split("\n").map(l=>l.trim()).filter(l=>l.includes("|"))
      .map(l=>l.replace(/^[-*\d.)\s]+/,"").split("|").map(x=>x.trim())).filter(a=>a[0]).slice(0,2);
    if(!parsed.length) throw new Error("형식을 알아볼 수 없습니다");
    btn.insertAdjacentHTML("beforebegin",parsed.map(a=>altCard(a[0],a[1]||"",true)).join(""));
    btn.remove(); bindAlts(i);
  }catch(err){
    btn.disabled=false; btn.textContent="다른 대안 더 찾기";
    btn.insertAdjacentHTML("afterend",`<div class="err">추가 검색 실패 — ${err.message}. 위의 두 종목은 그대로 쓸 수 있습니다.</div>`);
  }
}

const totalSets=()=>D().ex.reduce((a,e)=>a+e[1],0);
const doneSets=()=>D().ex.reduce((a,e,i)=>a+setsDone(i),0);
function updateProgress(){
  const d=doneSets(),t=totalSets();
  $("bar").style.width=(t?d/t*100:0)+"%";
  $("count").textContent=`${d} / ${t} 세트`;
  $("finish").disabled=d===0;
  if(storageOK===false) $("finish").textContent = d===t?"세션 완료 · 기록 텍스트 만들기":"여기까지 기록 텍스트 만들기";
  else $("finish").textContent = d===t?"세션 완료 · 저장":"여기까지 저장";
}

let timer=null,left=0,span=0;
function startRest(sec,name,i,s){
  span=sec;left=sec;
  const isLast=s+1>=D().ex[i][1];
  $("restname").textContent=name;
  $("restnext").textContent=isLast?(D().ex[i+1]?"다음 → "+nameOf(i+1):"마지막 종목"):`${s+2}세트 준비`;
  $("rest").classList.add("on");
  clearInterval(timer);tick();timer=setInterval(tick,1000);
}
function tick(){
  const t=$("resttime"),v=Math.abs(left);
  t.textContent=(left<0?"+":"")+Math.floor(v/60)+":"+String(v%60).padStart(2,"0");
  t.classList.toggle("over",left<=0);
  $("restline").style.width=Math.max(0,Math.min(100,left/span*100))+"%";
  if(left===0){ if(navigator.vibrate) navigator.vibrate([140,90,140]); beep(); }
  left--; if(left<-180) stopRest();
}
function stopRest(){ clearInterval(timer);timer=null;$("rest").classList.remove("on"); }
$("skip").addEventListener("click",stopRest);
$("plus30").addEventListener("click",()=>{left+=30;span+=30;tick();});

$("finish").addEventListener("click",async()=>{
  const rec={date:today(),day:curDay,title:D().title,ex:{}};
  D().ex.forEach((e,i)=>{
    const [orig,sets,reps,top]=e,name=nameOf(i);
    const arr=(entries[i]||[]).filter(x=>x&&x.done&&x.r);
    if(!arr.length) return;
    rec.ex[name]=arr.map(x=>({w:x.w||0,r:x.r}));
    store.last[name]={w:arr[arr.length-1].w||0,reps:arr.map(x=>x.r),
      allTop:arr.length===sets&&arr.every(x=>x.r>=top),date:rec.date};
  });
  store.history.unshift(rec); store.history=store.history.slice(0,60);
  const r = storageOK===false ? {ok:false,err:lastErr} : await setRetry(KEY,JSON.stringify(store),3);
  const ok=r.ok;
  if(ok){
    $("saved").textContent=`저장됨 · ${rec.date} Day ${curDay} · ${doneSets()}세트 — 다음은 Day ${nextDay()}`;
    $("saved").className="saved";
    dirty=false; markUnsaved();
  }else{
    $("saved").innerHTML = storageOK===false
      ? `<span class="err">자동 저장 불가 환경 — 아래 <b>기록 백업</b>을 복사해 메모 앱에 보관하세요.</span>`
      : `<span class="err">저장 실패 — ${r.err||"원인 미상"}<br>아래 <b>기록 백업</b>을 눌러 텍스트로 복사해두세요.</span>`;
  }
  showBackup(rec);
  setTimeout(()=>$("backup").scrollIntoView({behavior:"smooth",block:"start"}),200);
  stopRest(); renderOverview(); renderBrief(); renderBlocks(); render();
});

$("review").addEventListener("click",async()=>{
  const btn=$("review"),out=$("reviewout");
  const log=D().ex.map((e,i)=>{
    const arr=(entries[i]||[]).filter(x=>x&&x.done&&x.r);
    return arr.length?`${nameOf(i)} (목표 ${e[1]}×${e[2]}, RIR ${e[4]}): ${arr.map(x=>`${x.w||0}kg×${x.r}`).join(", ")}`:null;
  }).filter(Boolean).join("\n");
  if(!log){ out.textContent="완료 표시한 세트가 없습니다. 세트를 기록한 뒤 다시 눌러주세요."; return; }
  const prev=store.history.filter(h=>h.day===curDay).slice(0,2)
    .map(h=>`[${h.date}] ${Object.entries(h.ex).map(([k,v])=>`${k}: ${v.map(x=>`${x.w}kg×${x.r}`).join(", ")}`).join(" / ")}`).join("\n")||"이전 기록 없음";
  btn.disabled=true; btn.innerHTML='기록 읽는 중<span class="dots"></span>'; out.textContent="";
  try{
    out.textContent=await ask(
`아래는 오늘 웨이트 세션 기록이다. 다음에 같은 Day를 할 때 무엇을 바꿔야 하는지 코칭하라.

[사용자 상황]
${CONTEXT}

[오늘 · Day ${curDay} ${D().title}]
${log}

[같은 Day 이전 기록]
${prev}

[진행 규칙]
이중 점진 — 목표 반복 범위 상단을 전 세트 달성하면 다음에 한 단계 증량. 머신은 스택 핀 한 칸(보통 5kg), 케이블·덤벨은 2.5kg 단위. 상단에 못 미치면 같은 중량 유지. 실패 지점까지 밀지 않는다. 대근육 복합운동을 우선하고 팔은 마무리 종목이다.

[답변 형식]
한국어로. 항목당 한 줄, 최대 4줄. 각 줄은 "종목명 — 다음 조치" 형태로 구체적 숫자 포함. 마지막 한 줄로 전반 코멘트. 인사말·서두 없이 바로 시작. 마크다운 기호 금지.`);
  }catch(e){ out.innerHTML=`<span class="err">코칭을 불러오지 못했습니다 — ${e.message}</span>`; }
  btn.disabled=false; btn.textContent="오늘 기록 보고 다음 세션 조정받기";
});

function logText(rec){
  const lines=[`[${rec.date}] Day ${rec.day} · ${rec.title}`];
  for(const k in rec.ex) lines.push(`${k}: ${rec.ex[k].map(x=>`${x.w||0}kg x ${x.r}`).join(", ")}`);
  // 누적 기록도 함께 — 이 텍스트 하나만 있으면 다음에 전부 복원된다
  const acc=Object.keys(store.last);
  if(acc.length){
    lines.push("", "--- 누적 기록 (다음 세션에 이 텍스트 전체를 붙여넣으세요) ---");
    acc.forEach(k=>{
      const l=store.last[k];
      lines.push(`${k}: ${l.reps.map(r=>`${l.w||0}kg x ${r}`).join(", ")}`);
    });
  }
  return lines.join("\n");
}
// 백업 텍스트를 되읽어 지난 기록을 복원한다 (저장소가 없어도 동작)
function parseBackup(text){
  let day=null, date=null, n=0;
  const planTop={};
  DAYS.forEach(d=>d.ex.forEach(e=>{ planTop[e[0]]=[e[3],e[1]]; }));
  text.split("\n").forEach(raw=>{
    const line=raw.trim();
    // 구분선을 지나면 날짜 문맥이 끊긴다 — 헤더 없는 「누적 기록」 섹션은 date가 null이어야 한다
    if(line.startsWith("---")){ date=null; return; }
    if(!line) return;
    const h=line.match(/^\[([^\]]*)\]\s*Day\s*(\d+)/);
    if(h){ day=+h[2];
      const dt=h[1].trim(); date=/^\d{4}-\d{2}-\d{2}$/.test(dt) ? dt : null;
      return; }
    const i=line.indexOf(":");
    if(i<1) return;
    const name=line.slice(0,i).trim();
    const pairs=[...line.slice(i+1).matchAll(/(\d+(?:\.\d+)?)\s*kg\s*x\s*(\d+)/g)];
    if(!pairs.length) return;
    const w=+pairs[pairs.length-1][1], reps=pairs.map(p=>+p[2]);
    const t=planTop[name];
    store.last[name]={w, reps, date,
      allTop: !!(t && reps.length===t[1] && reps.every(r=>r>=t[0]))};
    n++;
  });
  return {count:n, day};
}
function showBackup(rec){
  const box=$("backup");
  box.style.display="block";
  box.innerHTML=`<span class="eyebrow">기록 백업</span>
    <textarea id="baktext" readonly rows="7">${logText(rec)}</textarea>
    <button class="coachbtn" id="bakcopy" style="background:var(--brass);color:#2B2836;border-color:var(--brass)">한 번에 복사하기</button>
    <div class="bakhint">이 텍스트를 메모장에 붙여두고, 다음 세션 시작할 때 맨 위 "지난 기록 불러오기"에 그대로 붙여넣으면 중량이 복원됩니다.</div>`;
  $("bakcopy").addEventListener("click",async()=>{
    const t=$("baktext");
    try{ await navigator.clipboard.writeText(t.value); $("bakcopy").textContent="복사됨"; }
    catch(e){ t.select(); document.execCommand&&document.execCommand("copy"); $("bakcopy").textContent="복사됨 (길게 눌러 복사도 가능)"; }
  });
}
function applyRestore(text,src){
  const r=parseBackup(text||"");
  if(!r.count){ $("resmsg").innerHTML='<span class="err">읽을 수 있는 기록이 없습니다. "종목명: 20kg x 10, ..." 형식이어야 합니다.</span>'; return false; }
  if(r.day) curDay=(r.day % DAYS.length)+1;
  renderOverview(); renderBrief(); renderBlocks(); render();
  // 복원된 내용을 그대로 보여준다 — 어느 Day에 들어갔는지까지
  let html=`<div class="okline">${src} 종목 ${r.count}개 복원 완료</div>`;
  DAYS.forEach(d=>{
    const hit=d.ex.filter(e=>store.last[e[0]]);
    if(!hit.length) return;
    html+=`<div class="rgroup"><div class="rgt">DAY ${d.n} · ${d.title}</div>`
      + hit.map(e=>{ const l=store.last[e[0]];
          return `<div class="rgi"><span>${e[0]}</span><span class="rgv">${l.w>0?l.w+"kg":"기본"} × ${l.reps.join(", ")}${l.allTop?' <b>↑증량</b>':''}</span></div>`;
        }).join("") + `</div>`;
  });
  if(r.day) html+=`<div class="okline">화면은 다음 차례인 <b>Day ${curDay}</b>로 이동했습니다. 위 목록의 Day를 눌러 확인할 수 있습니다.</div>`;
  $("resmsg").innerHTML=html;
  return true;
}
$("clipload").addEventListener("click",async()=>{
  try{
    const t=await navigator.clipboard.readText();
    if(!t||!t.trim()){ $("resmsg").innerHTML='<span class="err">클립보드가 비어 있습니다.</span>'; return; }
    applyRestore(t,"클립보드에서");
  }catch(e){
    $("resmsg").innerHTML='<span class="err">클립보드를 읽지 못했습니다. 아래 칸에 직접 붙여넣어 주세요.</span>';
  }
});
$("resbtn").addEventListener("click",()=>{
  const t=$("restext").value||"";
  if(!t.trim()){ $("resmsg").innerHTML='<span class="err">붙여넣은 내용이 없습니다.</span>'; return; }
  applyRestore(t,"");
});
async function envCheck(){
  let ok=false;
  try{ await window.storage.list("",false); ok=true; }catch(e){ lastErr=e&&e.message?e.message:String(e); }
  const wake="wakeLock" in navigator, vib=!!navigator.vibrate;
  $("env").innerHTML=`<span class="${ok?"y":"n"}">${ok?"●":"○"} 기록 저장</span>`+
    `<span class="${wake?"y":"n"}">${wake?"●":"○"} 화면 유지</span>`+
    `<span class="${vib?"y":"n"}">${vib?"●":"○"} 진동</span><span class="y">● 알림음</span>`+
    (ok?"":`<span class="n">저장소를 쓸 수 없는 환경입니다${lastErr?" ("+lastErr+")":""} — 세션 끝에 기록 백업을 복사해두세요</span>`);
}

(async function(){
  const d=new Date();
  $("today").textContent=`${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} (${DOW[d.getDay()]})`;
  await load(); renderOverview(); renderBrief(); renderBlocks(); render(); markUnsaved(); keepAwake(); await probeStorage(); envCheck();
})();
</script>
