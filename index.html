}
const nameOf=i=>swaps[i]||(todayEx()[i]||{}).name||"";
/* 무게 0 은 "안 더함" 이다 — 머신은 기본 무게, 프리웨이트는 빈 봉, 맨몸은 자기 몸.
   숫자 0 을 그대로 보여주면 오해를 부르므로 「기본」으로 쓴다. */
const wTxt=w=>w>0?w+"kg":"기본";
/* 태그 줄은 자리가 빠듯하다. `대퇴사두·코어` 처럼 둘을 묶은 target 은 앞쪽만 태그로 쓴다 —
   프로그램의 target 값 자체는 그대로고, 화면 태그에서만 줄인다.
   이걸 안 줄이면 매 Day 첫 카드(프리웨이트 복합운동)가 아이폰 폭에서 두 줄이 된다. */
const tagTarget=t=>String(t==null?"":t).split("·")[0].trim();
function lastText(l){
  const s=l.sets&&l.sets.length?l.sets:null;
  if(!s) return `${l.w>0?l.w+"kg × ":""}${(l.reps||[]).join(", ")}회`;
  const same=s.every(v=>v.w===s[0].w);
  return same ? `${wTxt(s[0].w)} × ${s.map(v=>v.r).join(", ")}회`
              : s.map(v=>`${wTxt(v.w)}×${v.r}`).join(", ");
}
const setsDone=i=>(entries[i]||[]).filter(x=>x&&x.done).length;
// 건너뛴 종목에서 멈추지 않는다 — 안 그러면 활성 테두리가 거기 붙어 영원히 안 넘어간다
function activeIdx(){
  const ex=todayEx();
  for(let i=0;i<ex.length;i++) if(!sessionSkip[i]&&setsDone(i)<setsOf(i)) return i;
  return -1;
}

function render(){
  const act=activeIdx();
  $("list").innerHTML=todayEx().map((e,i)=>{
    const {name:orig,reps,top,rir,rest,target,cue,mode:wmode,kind,alts,inc,equip}=e;
    const name=nameOf(i), bw=wmode==="맨몸";
    /* 건너뛴 종목은 접는다. 사라지지는 않는다 — 같은 체크박스로 되돌린다 */
    if(sessionSkip[i]) return `<div class="skipcard" id="ex-${i}">
      <button class="skipbox" type="button" data-skip="${i}" aria-pressed="true"
              aria-label="${esc(name)} 건너뛰기 해제"><span class="bx">✓</span>되돌리기</button>
      <div><div class="sname">${esc(name)}</div>
        <div class="snote">오늘 건너뜀 · 진행률에서 제외</div></div></div>`;
    const sets=setsOf(i);                       // 오늘의 세트 수. e.sets 는 계획값이다
    /* 대체 종목 프리필 — 읽기 전용 규칙 (SCHEMA). 쓰기는 언제나 실제 수행 종목이다.
       ① 실제 종목 기록이 있으면 그것 ② 없으면 그 자리 원래 종목으로 폴백
       ③ 폴백이면 출처를 밝힌다 ④ 폴백으로는 증량 판정을 하지 않는다 */
    const own=idx.lastByExercise[name];
    const fb=(!own&&name!==orig)?idx.lastByExercise[orig]:null;
    const l=own||fb, fallback=!own&&!!fb;
    /* 증량 판정에서 w>0 을 요구하지 않는다. 빈 봉이나 머신 기본 무게로 목표 상단을
       전 세트 채웠다면 다음은 첫 원판을 올릴 차례다. 맨몸 종목만 제외하면 된다. */
    const up=!!(own&&own.allTop&&wmode!=="맨몸");
    const first=(entries[i]&&entries[i][0])||{};
    const eqTag = equip==="프리"?`<span class="tag free">프리웨이트</span>`
                : equip==="맨몸"?`<span class="tag free">맨몸</span>`:``;
    const tag = eqTag + (kind==="대근육"?`<span class="tag big">대근육</span>`
              : kind==="팔"?`<span class="tag arm">팔</span>`
              : `<span class="tag acc">보조</span>`);
    const rows=Array.from({length:sets},(_,s)=>{
      const v=(entries[i]&&entries[i][s])||{};
      /* 프리필은 세트별로 맞춘다. 지난번에 30/35/40kg 로 올려가며 했다면
         이번에도 그 세트에는 그 무게가 떠야 한다. 옛 방식(무게 하나를 전 세트에 복사)은
         세트마다 무게를 바꾸는 사람에게는 매번 틀린 값을 내민다. */
      const hs=(l&&l.sets&&l.sets[s])||null;
      let pw=v.w,gw=false;
      if(pw===undefined){
        if(hs){ pw=up?+(hs.w+(inc||2.5)).toFixed(1):hs.w; gw=true; }   // 그 세트의 지난 무게
        else if(s>0&&first.w!==undefined){ pw=first.w; gw=true; }      // 이번 세션 1세트 값 따라가기
        else if(l){ pw=up?+(l.w+(inc||2.5)).toFixed(1):l.w; gw=true; } // 옛 기록(세트별 무게 없음)
      }
      let pr=v.r,gr=false;
      if(pr===undefined){
        if(hs) pr=hs.r, gr=true;
        else if(s>0&&first.r!==undefined) pr=first.r, gr=true;
      }
      return `<div class="set"><span class="sn">${s+1}</span>
        <input type="number" inputmode="decimal" step="0.5" placeholder="${bw?"—":"kg"}" class="${gw?"ghost":""}" ${bw?"disabled":""}
          value="${bw||pw===undefined||pw===0?"":pw}" data-i="${i}" data-s="${s}" data-f="w" aria-label="${esc(name)} ${s+1}세트 중량">
        <input type="number" inputmode="numeric" placeholder="회" class="${gr?"ghost":""}"
          value="${pr===undefined?"":pr}" data-i="${i}" data-s="${s}" data-f="r" aria-label="${esc(name)} ${s+1}세트 반복">
        <div class="chk" role="button" tabindex="0" aria-pressed="${!!v.done}" data-i="${i}" data-s="${s}" data-rest="${rest}" aria-label="${s+1}세트 완료">✓</div></div>`;
    }).join("");
    const setsChanged = sessionSets[i]>0 && sessionSets[i]!==e.sets;
    return `<section class="ex ${setsDone(i)>=sets?"done":""} ${i===act?"active":""}" id="ex-${i}">
      <div class="tagline">${tag}${target?`<span class="tag acc">${esc(tagTarget(target))}</span>`:""}${isAdded(i)?`<span class="tag arm">오늘 추가</span>`:""}
        <span class="tagctl">
          <button class="skipbox icon" type="button" data-skip="${i}" aria-pressed="false"
                  title="오늘 건너뛰기"
                  aria-label="${esc(name)} 오늘 건너뛰기"><span class="bx">✓</span></button>
          <button class="gearbtn" type="button" data-gear="${i}" aria-expanded="${openSheet===i}"
                  aria-label="${esc(name)} 계획 고치기">⚙</button></span></div>
      <div class="exhead"><div>
        <div class="exname">${esc(name)}${swaps[i]?`<span class="swapped">${fromMemory(i,orig)?"지난번처럼 대체":"대체"} · 원래 ${esc(orig)}</span>`:""}</div>
        <div class="extarget">${sets} × ${esc(reps)}회 · RIR ${rir} · 휴식 ${rest>=60?(rest/60)+"분":rest+"초"}${setsChanged?` <em>오늘만 ${e.sets}→${sets}</em>`:""}</div>
        <div class="cue">${cue}</div>
      </div><span class="idx">${String(i+1).padStart(2,"0")}</span></div>
      <div class="last">${!l?"지난 기록 없음 — 가볍게 시작"
        :`지난 기록 · ${fallback?esc(orig)+" ":""}${lastText(l)}${l.rir&&RIRTXT[l.rir]?" · "+RIRTXT[l.rir]:""}${fallback?' <b class="fb">(다른 종목)</b>':""}`}</div>
      ${up?`<span class="up">↑ 다음 중량 +${inc||2.5}kg</span>`:(own?`<span class="keep">지난 중량 유지 · 반복 수를 늘려보세요</span>`:"")}
      <div class="setlabels"><span></span><span>${bw?"맨몸":wmode}${l?" · 제안":""}</span><span>반복</span><span>완료</span></div>
      <div class="sets">${rows}</div>
      <div class="setctl">
        <button class="addset" type="button" data-addset="${i}">+ 세트 추가</button>
        <button class="delset" type="button" data-delset="${i}" aria-label="세트 빼기"
                ${sets<=1||setsDone(i)>=sets?"disabled":""}>−</button>
      </div>
      ${/* 4-1 — 세트를 다 마쳤을 때만 뜬다. 세트마다 물으면 21탭이지만 이러면 6~7탭이다 */
        setsDone(i)>=sets&&sets>0?`<div class="rirlab">마지막 세트 느낌 · 선택</div><div class="rir">${
        Object.keys(RIRTXT).map(k=>`<button class="rirchip" type="button" data-rir="${i}" data-v="${k}"
          aria-pressed="${rirs[i]===k}">${RIRTXT[k]}</button>`).join("")}</div>`:""}
      ${openSheet===i?sheetHTML(i):""}
    </section>`;
  }).join("");
  bind(); updateProgress();
}

function bind(){
  $("list").querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("focus",()=>{inp.classList.remove("ghost");keepAwake();armAudio();});
    inp.addEventListener("input",()=>{
      const {i,s,f}=inp.dataset;
      entries[i]=entries[i]||[]; entries[i][s]=entries[i][s]||{};
      entries[i][s][f]=inp.value===""?undefined:+inp.value;
      inp.classList.remove("ghost"); saveDraft();
    });
  });
  $("list").querySelectorAll(".chk").forEach(btn=>{
    const go=()=>{
      const i=+btn.dataset.i,s=+btn.dataset.s,rest=+btn.dataset.rest;
      entries[i]=entries[i]||[]; entries[i][s]=entries[i][s]||{};
      const setEl=btn.closest(".set");
      // 반복 없이 완료하면 저장 때 그 세트가 조용히 버려진다 (filter(x=>x.done&&x.r)).
      // 45분 뒤 저장 시점에 경고하면 늦다 — 켜지는 순간 막고 반복 칸으로 보낸다.
      // 끄는 동작은 막지 않는다. 안 그러면 잘못 켠 세트를 되돌릴 수 없다.
      const rInp=setEl.querySelector('input[data-f="r"]');
      if(!entries[i][s].done && rInp && !(+rInp.value>0)){
        rInp.classList.remove("ghost","need"); void rInp.offsetWidth;   // 연타해도 애니메이션이 다시 돈다
        rInp.classList.add("need"); rInp.focus(); rInp.select();
        setTimeout(()=>rInp.classList.remove("need"),1200);
        return;
      }
      setEl.querySelectorAll("input").forEach(inp=>{
        if(inp.value!==""&&!inp.disabled) entries[i][s][inp.dataset.f]=+inp.value; });
      const on=!entries[i][s].done; entries[i][s].done=on;
      // 소요 시간의 기준점 — 첫 세트 완료부터 저장까지다 (SPEC 4-2)
      if(on&&!startMark) startMark=Date.now();
      saveDraft(); keepAwake(); armAudio();
      const fin=on&&setsDone(i)>=setsOf(i);
      if(on) startRest(rest,nameOf(i),i,s); else stopRest();
      render();
      /* ⚠ 종목을 마치는 순간 RIR 칩이 그때 처음 뜬다 (아래 4-1 렌더).
         예전에는 곧바로 다음 카드로 스크롤해서 칩이 화면 위로 밀려났고, 폰에서는
         「칩이 아예 안 뜬다」로 보였다 (11회차 · 실사용에서 잡혔다).
         아직 안 골랐으면 칩을 먼저 보여주고, 고른 뒤에 다음 카드로 넘어간다
         (칩 핸들러가 이어받는다). 고르지 않고 지나가도 막지 않는다 — 「선택」이다 */
      if(fin){
        const card=$("ex-"+i), chips=(rirs[i]===undefined&&card)?card.querySelector(".rir"):null;
        const el=chips||$("ex-"+(i+1));
        if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:chips?"end":"start"}),260);
      }
    };
    btn.addEventListener("click",go);
    btn.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  });
  bindQuick();
}

/* ── 퀵수정 조작 ── */
function bindQuick(){
  const L=$("list"), on=(sel,fn,ev)=>L.querySelectorAll(sel).forEach(el=>el.addEventListener(ev||"click",fn));

  // 카드 = 오늘만
  on("[data-skip]",e=>{
    const i=+e.currentTarget.dataset.skip;
    if(sessionSkip[i]) delete sessionSkip[i]; else sessionSkip[i]=true;
    if(sessionSkip[i]&&openSheet===i) openSheet=-1;
    saveDraft(); stopRest(); render();
  });
  // 같은 칩을 다시 누르면 해제된다. 잘못 눌렀을 때 되돌릴 길이 있어야 한다
  on("[data-rir]",e=>{
    const t=e.currentTarget, i=+t.dataset.rir, v=t.dataset.v;
    if(rirs[i]===v) delete rirs[i]; else rirs[i]=v;
    const picked=rirs[i]!==undefined;
    saveDraft(); render();
    /* 칩을 고르면 그때 다음 카드로 넘어간다 — 마친 직후의 스크롤을 여기로 미룬 것이다.
       해제할 때는 움직이지 않는다. 다음 종목이 이미 끝나 있으면(나중에 되돌아와 고치는
       경우다) 화면을 낚아채지 않는다 */
    if(picked){
      const n=i+1, nx=$("ex-"+n);
      if(nx&&todayEx()[n]&&!sessionSkip[n]&&setsDone(n)<setsOf(n))
        setTimeout(()=>nx.scrollIntoView({behavior:"smooth",block:"start"}),200);
    }
  });
  on("[data-addset]",e=>{
    const i=+e.currentTarget.dataset.addset, n=setsOf(i);
    if(n>=12) return;                        // 한 종목 12세트는 오입력이다
    sessionSets[i]=n+1; saveDraft(); render();
  });
  on("[data-delset]",e=>{
    const i=+e.currentTarget.dataset.delset, n=setsOf(i)-1;
    if(n<1||n<setsDone(i)) return;           // 이미 기록한 세트는 지우지 않는다
    sessionSets[i]=n;
    if(entries[i]) entries[i]=entries[i].slice(0,n);
    saveDraft(); render();
  });
  on("[data-gear]",e=>{
    const i=+e.currentTarget.dataset.gear;
    openSheet = openSheet===i ? -1 : i; pickMode=null;
    if(openSheet===i) sheetBase=D().ex.reduce((a,x)=>a+x.sets,0);   // 세트 수 변화의 기준선
    render();
    if(openSheet===i){ const el=$("ex-"+i); if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"nearest"}),60); }
  });
  on("[data-close]",e=>{ openSheet=-1; pickMode=null; render(); });

  // 종목 고르기 (오늘만 / 자리 교체)
  on("[data-openpick]",e=>{ pickMode=e.currentTarget.dataset.openpick; render(); });
  on("[data-pickback]",e=>{ pickMode=null; render(); });
  on("[data-pick2]",e=>{ const t=e.currentTarget, x=pickCache[+t.dataset.pick2];
    applyPick(+t.dataset.i, t.dataset.m, x.name, x.ex); });
  on("[data-pickok]",e=>{ const t=e.currentTarget;
    applyPick(+t.dataset.pickok, t.dataset.m, $("pickname").value, null); });

  // 시트 · 오늘만 구역
  on("[data-alt]",e=>{ const t=e.currentTarget;
    swaps[+t.dataset.alt]=t.dataset.name; openSheet=-1; saveDraft(); render(); });
  /* 되돌리면 기억도 지운다. 안 지우면 Day 를 다시 열 때마다 대체가 되살아나
     원래 종목으로 돌아갈 방법이 없어진다. */
  on("[data-revert]",e=>{
    const i=+e.currentTarget.dataset.revert, orig=todayEx()[i];
    delete swaps[i];
    if(orig&&idx.swapMemory&&idx.swapMemory[orig.name]){
      delete idx.swapMemory[orig.name]; idx.rev++;
      writeJSON(K.index,idx).then(w=>{ if(!w.ok) banner(`대체 되돌리기를 저장하지 못했습니다 (${w.err||"원인 미상"}).`); });
    }
    saveDraft(); render();
  });

  // 시트 · 프로그램 구역 — 고치는 즉시 wk:program 에 쓴다
  on("[data-psets]",async e=>{
    const t=e.currentTarget, i=+t.dataset.psets, ex=todayEx()[i], n=ex.sets+(+t.dataset.d);
    if(n<1||n>10) return;
    if(n<setsDone(i)&&!sessionSets[i]){ $("qerr-"+i).textContent="이미 기록한 세트보다 적게 줄일 수 없습니다."; return; }
    ex.sets=n;
    delete sessionSets[i];                   // 계획이 바뀌었으니 오늘만 값은 물러난다
    await sheetSaved();
  });
  on("[data-reps]",async e=>{
    const t=e.currentTarget, i=+t.dataset.reps, ex=todayEx()[i], box=$("qerr-"+i);
    const inputs=t.closest(".qtwo").querySelectorAll("input");
    const lo=+inputs[0].value, hi=+inputs[1].value;
    if(!(lo>=1&&lo<=100&&hi>=1&&hi<=100)){ if(box) box.textContent="반복 수는 1~100 사이여야 합니다."; return; }
    if(hi<lo){ if(box) box.textContent="반복 범위의 오른쪽이 왼쪽보다 작습니다."; return; }
    ex.reps=(lo===hi)?String(lo):`${lo}-${hi}`; ex.top=topOf(ex.reps);
    await sheetSaved();
  },"change");
  on("[data-qrest]",async e=>{ const t=e.currentTarget;
    todayEx()[+t.dataset.qrest].rest=+t.dataset.v; await sheetSaved(); });
}

/* ── 오늘 종목 추가 ──
   대개는 이미 아는 종목이다. 고르면 키보드가 안 뜨고 지난 중량까지 따라온다. */
function candidates(exclude){
  const skip=new Set(exclude), seen=new Set(), out=[];
  PROG().forEach(d=>d.ex.forEach(x=>{ if(skip.has(x.name)||seen.has(x.name)) return;
    seen.add(x.name); out.push({name:x.name, src:`Day ${d.n}`, ex:x}); }));
  Object.keys(idx.lastByExercise).forEach(n=>{ if(skip.has(n)||seen.has(n)) return;
    seen.add(n); out.push({name:n, src:"지난 기록", ex:null}); });
  return out;
}
const addCandidates=()=>candidates(todayEx().map(x=>x.name));
// 오늘 목록에 있는 것은 전부 뺀다 — 자기 자신으로 바꾸는 선택지가 있으면 헷갈리기만 한다
const swapCandidates=()=>candidates(todayEx().map((x,k)=>swaps[k]||x.name));
function renderAddSheet(){
  const box=$("addsheet");
  if(openSheet!==-2){ box.innerHTML=""; return; }
  const c=addCandidates().slice(0,14);
  box.innerHTML=`<div class="qsheet">
    <label class="qswitch"><input type="checkbox" id="addtoprog">
      이 Day 프로그램에도 넣기 — 세션을 저장할 때 반영됩니다</label>
    <div class="qz today">골라서 바로 추가</div>
    ${c.length?`<div class="qchips" style="flex-direction:column">${c.map((x,k)=>{
        const l=idx.lastByExercise[x.name];
        return `<button class="pickchip" type="button" data-pick="${k}">${esc(x.name)}
          <span class="src">${esc(x.src)}${l?" · 지난 "+esc(lastText(l)):""}</span></button>`;
      }).join("")}</div>`
      :`<div class="bakhint">고를 만한 종목이 없습니다. 아래에 직접 입력해주세요.</div>`}
    <div class="qz prog">직접 입력</div>
    <input type="text" class="qname" id="addname" maxlength="40" placeholder="예) 케이블 풀오버">
    <div class="qerr" id="adderr"></div>
    <button class="qdone" type="button" id="addok">오늘 목록에 추가</button>
    <button class="coachbtn" type="button" id="addcancel" style="margin-top:8px">닫기</button>
  </div>`;
  const toProg=()=>$("addtoprog").checked;
  box.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{
    const x=c[+b.dataset.pick];
    const err=addToday(x.name, x.ex, toProg());
    if(err){ $("adderr").textContent=err; return; }
    openSheet=-1; saveDraft(); renderAddSheet(); render();
  }));
  $("addok").addEventListener("click",()=>{
    const err=addToday($("addname").value, null, toProg());
    if(err){ $("adderr").textContent=err; return; }
    openSheet=-1; saveDraft(); renderAddSheet(); render();
  });
  $("addcancel").addEventListener("click",()=>{ openSheet=-1; renderAddSheet(); });
}
function addToday(name,srcEx,toProg){
  name=(name||"").trim();
  if(!name) return "이름을 입력하세요.";
  if(todayEx().some(x=>x.name===name)) return "오늘 목록에 이미 있는 종목입니다.";
  const base = srcEx ? JSON.parse(JSON.stringify(srcEx))
    // target 은 비워둔다 — 모르는 값을 지어내면 「오늘 추가」 태그와 글자가 겹쳐 두 번 뜬다
    : {name, sets:3, reps:"8-12", top:12, rir:"2", rest:90, inc:5, mode:"kg",
       target:"", kind:"보조", equip:"머신", cue:"", alts:[]};
  base.name=name;
  if(toProg) base.toProgram=true;   // 저장 시점에 D().ex 로 옮긴다 (아래 promoteAdds)
  sessionAdds.push(base);
  return "";
}
$("note").addEventListener("input",e=>{ note=e.target.value; saveDraft(); });
$("addex").addEventListener("click",()=>{
  openSheet = openSheet===-2 ? -1 : -2;
  renderAddSheet(); render();
  if(openSheet===-2) setTimeout(()=>$("addsheet").scrollIntoView({behavior:"smooth",block:"nearest"}),60);
});
/* 「이 Day 프로그램에도 넣기」는 저장 시점에 반영한다.
   세션 중에 D().ex 에 밀어 넣으면 todayEx() 의 뒷부분 순서가 바뀌어
   이미 입력한 값이 옆 종목으로 옮겨 붙는다. 저장 뒤에 옮기고 인덱스를 다시 매핑한다. */
async function promoteAdds(){
  const promo=sessionAdds.filter(x=>x.toProgram);
  if(!promo.length) return;
  const oldList=todayEx().slice();
  promo.forEach(x=>{ delete x.toProgram; D().ex.push(x); });   // 같은 객체를 밀어넣어야 매핑이 된다
  sessionAdds=sessionAdds.filter(x=>promo.indexOf(x)<0);
  const newList=todayEx();
  /* ⚠ 인덱스를 키로 쓰는 세션 상태는 다섯이다 — entries · swaps · sessionSets · sessionSkip · rirs.
     하나라도 빠뜨리면 그 값만 옛 자리에 남아 옆 종목에 붙는다. rirs 를 빠뜨렸을 때
     실제로 재저장에서 A종목의 RIR 이 B종목에 기록됐다 (2026-08-16 코드 검수). */
  const ne={}, nsw={}, nss={}, nsk={}, nr={};
  oldList.forEach((o,oi)=>{
    const ni=newList.indexOf(o); if(ni<0) return;
    if(entries[oi]!==undefined) ne[ni]=entries[oi];
    if(swaps[oi]!==undefined) nsw[ni]=swaps[oi];
    if(sessionSets[oi]!==undefined) nss[ni]=sessionSets[oi];
    if(sessionSkip[oi]!==undefined) nsk[ni]=sessionSkip[oi];
    if(rirs[oi]!==undefined) nr[ni]=rirs[oi];
  });
  entries=ne; swaps=nsw; sessionSets=nss; sessionSkip=nsk; rirs=nr;
  await saveProgram();
}

/* ── ⚙ 시트 — 여기서 고치는 것은 전부 계획(wk:program)이다 ──
   카드에서 하는 것은 오늘만, 시트에서 하는 것은 계속. 자리가 곧 범위라서
   「다음부터도 적용」 체크박스가 없다. 확인할 상태가 없는 편이 세트 사이에 맞다.
   대체 종목만은 오늘만이므로 시트 안에서도 구역을 갈라 둔다.
   휴식·증량은 스테퍼가 아니라 칩이다 — 실제로 쓰는 값이 몇 개뿐인데
   스테퍼면 2.5 에서 5 로 가는 데 다섯 번을 눌러야 한다. */
/* 증량 단위는 이 시트에 두지 않는다. 이중 점진의 증가폭이라 필요한 값이지만
   세션 중에 고칠 일이 없다 — 5단계 편집기에 있다. */
const RESTS=[45,60,90,120,150,180];
let pickMode=null, pickCache=[];      // 종목 고르기 화면 (오늘만 / 교체)
function sheetHTML(i){
  if(pickMode) return pickerHTML(i,pickMode);
  const e=todayEx()[i], alts=e.alts||[];
  let h=`<div class="qsheet"><div class="qz today">오늘만</div>`;
  if(swaps[i]) h+=`<button class="qact plain" type="button" data-revert="${i}">원래 종목으로 되돌리기<span class="aw">${esc(e.name)}</span></button>`;
  if(alts.length) h+=alts.map(a=>`<button class="qact" type="button" data-alt="${i}" data-name="${esc(a[0])}">${esc(a[0])}<span class="aw">${esc(a[1])}</span></button>`).join("");
  h+=`<button class="qact plain" type="button" data-openpick="today">다른 종목으로 · 오늘만
        <span class="aw">목록에서 고르거나 직접 입력합니다. 프로그램은 그대로입니다</span></button>`;
  const rr=repsRange(e.reps);
  const tot=D().ex.reduce((a,x)=>a+x.sets,0);
  h+=`<div class="qz prog">프로그램 · 다음부터 계속</div>`;
  if(isAdded(i)){
    h+=`<div class="bakhint">오늘 추가한 종목이라 아직 계획에 없습니다.
      「이 Day 프로그램에도 넣기」를 켜고 추가했다면 세션을 저장할 때 들어갑니다.</div>`;
  }else{
    h+=`<div class="qrow"><div class="ql">계획 세트<i>Day ${curDay} · ${sheetBase}세트${tot!==sheetBase?` → ${tot}세트`:""}</i></div>
      <div class="qgrp">
        <button class="qbtn" type="button" data-psets="${i}" data-d="-1" ${e.sets<=1?"disabled":""}>−</button>
        <span class="qval">${e.sets}</span>
        <button class="qbtn" type="button" data-psets="${i}" data-d="1" ${e.sets>=10?"disabled":""}>+</button></div></div>
    <div class="qrow"><div class="ql">반복 범위</div>
      <div class="qtwo">
        <input type="number" inputmode="numeric" min="1" max="100" value="${rr[0]}" data-reps="${i}" data-k="lo" aria-label="반복 하한">
        <span>~</span>
        <input type="number" inputmode="numeric" min="1" max="100" value="${rr[1]}" data-reps="${i}" data-k="hi" aria-label="반복 상한"></div></div>
    <div class="qrow"><div class="ql">휴식 · 초</div></div>
    <div class="qchips">${RESTS.map(v=>`<button class="qchip" type="button" data-qrest="${i}" data-v="${v}" aria-pressed="${e.rest===v}">${v}</button>`).join("")}</div>`;
  }
  h+=`<button class="qact" type="button" data-openpick="prog" style="margin-top:11px">이 자리를 다른 종목으로 교체
        <span class="aw">${i+1}번째 자리는 그대로. 다음부터 계속 이 종목입니다</span></button>
    <div class="qerr" id="qerr-${i}"></div>`;
  return h+`<button class="qdone" type="button" data-close="${i}">완료</button></div>`;
}
/* 자리를 지키는 교체. 「대체 종목」(오늘만)과도, 「오늘 종목 추가」(맨 뒤)와도 다르다.
   맨 뒤에 추가하고 원래 것을 건너뛰는 것으로는 순서가 어긋나고 손도 두 번 간다. */
function pickerHTML(i,mode){
  pickCache=swapCandidates().slice(0,16);
  const cur=todayEx()[i];
  return `<div class="qsheet">
    <div class="qz ${mode==="today"?"today":"prog"}">${mode==="today"?"오늘만 다른 종목으로":`${i+1}번째 자리를 교체`}</div>
    <div class="bakhint">${mode==="today"
      ? `오늘 이 자리에서만 다른 종목을 합니다. <b>프로그램은 그대로</b>이고 기록에는 원래 종목이 <b>${esc(cur.name)}</b> 로 남습니다.`
      : `<b>${esc(cur.name)}</b> 를 빼고 그 자리에 넣습니다. <b>순서는 ${i+1}번째 그대로</b>이고, 지난 기록은 어느 쪽도 지우지 않습니다.`}</div>
    ${pickCache.length?`<div class="qchips" style="flex-direction:column">${pickCache.map((x,k)=>{
      const l=idx.lastByExercise[x.name];
      return `<button class="pickchip" type="button" data-pick2="${k}" data-i="${i}" data-m="${mode}">${esc(x.name)}
        <span class="src">${esc(x.src)}${l?" · 지난 "+esc(lastText(l)):""}</span></button>`;
    }).join("")}</div>`:`<div class="bakhint">고를 만한 종목이 없습니다. 아래에 직접 입력해주세요.</div>`}
    <div class="qz prog">직접 입력</div>
    <input type="text" class="qname" id="pickname" maxlength="40" placeholder="종목 이름">
    <div class="qerr" id="pickerr"></div>
    <button class="qdone" type="button" data-pickok="${i}" data-m="${mode}">이 이름으로</button>
    <button class="coachbtn" type="button" data-pickback="1" style="margin-top:8px">뒤로</button>
  </div>`;
}
function applyPick(i,mode,name,srcEx){
  const box=$("pickerr");
  const fail=m=>{ if(box) box.textContent=m; };
  name=(name||"").trim();
  if(!name) return fail("이름을 입력하세요.");
  if(todayEx().some((x,k)=>k!==i&&(swaps[k]||x.name)===name)) return fail("오늘 목록에 이미 있는 종목입니다.");
  if(mode==="today"){
    swaps[i]=name; pickMode=null; openSheet=-1; saveDraft(); render(); return;
  }
  if(!isAdded(i)&&D().ex.some((x,k)=>k!==i&&x.name===name)) return fail("이 Day 에 이미 있는 종목입니다.");
  const base = srcEx?JSON.parse(JSON.stringify(srcEx))
    :{name, sets:3, reps:"8-12", top:12, rir:"2", rest:90, inc:5, mode:"kg",
      target:"", kind:"보조", equip:"머신", cue:"", alts:[]};
  base.name=name;
  if(isAdded(i)){ base.toProgram=todayEx()[i].toProgram; sessionAdds[i-D().ex.length]=base; }
  else D().ex[i]=base;
  /* 자리에 다른 종목이 들어왔다. 이 자리의 입력과 오늘 값은 전부 의미가 없어진다.
     ⚠ 인덱스를 키로 쓰는 세션 상태는 다섯이다 — rirs 를 빠뜨리면 옛 종목의 RIR 이
     새 종목에 그대로 붙어 저장된다 (promoteAdds 와 같은 종류. 10회차에 발견). */
  delete entries[i]; delete swaps[i]; delete sessionSets[i]; delete sessionSkip[i]; delete rirs[i];
  pickMode=null; openSheet=-1;
  saveDraft(); stopRest(); sheetSaved();
}
// 시트에서 프로그램을 고친 뒤 — 총정리·브리핑·5단계 편집기의 세트 수까지 따라가야 한다
async function sheetSaved(){
  pruneSwapMemory();            // 자리 교체로 사라진 종목의 대체 기억을 남기지 않는다
  await saveProgram(); renderOverview(); renderBrief(); render(); renderEditor();
}

/* 건너뛴 종목은 분모에서 뺀다. 안 그러면 다 하고도 진행률이 100% 에 닿지 못한다 */
const totalSets=()=>todayEx().reduce((a,e,i)=>a+(sessionSkip[i]?0:setsOf(i)),0);
const doneSets=()=>todayEx().reduce((a,e,i)=>a+(sessionSkip[i]?0:setsDone(i)),0);
function updateProgress(){
  const d=doneSets(),t=totalSets();
  $("bar").style.width=(t?d/t*100:0)+"%";
  $("count").textContent=`${d} / ${t} 세트`;
  $("finish").disabled=d===0;
  if(storageOK===false) $("finish").textContent = d===t?"세션 완료 · 기록 텍스트 만들기":"여기까지 기록 텍스트 만들기";
  else $("finish").textContent = d===t?"세션 완료 · 저장":"여기까지 저장";
}

/* 4-4 — 남은 시간을 1초씩 빼지 않는다.
   iOS 는 앱이 백그라운드로 가거나 화면이 꺼지면 setInterval 을 멈춘다. 빼는 방식이면
   멈춰 있던 만큼 그대로 밀린다 — 30초 나갔다 오면 30초 늦게 끝난다.
   종료 시각을 Date.now() 로 잡아두고 매번 다시 계산하면 돌아오는 순간 정확하다. */
let timer=null, endAt=0, span=0;
const leftSec=()=>Math.round((endAt-Date.now())/1000);
function startRest(sec,name,i,s){
  span=sec; endAt=Date.now()+sec*1000;
  const isLast=s+1>=setsOf(i);
  $("restname").textContent=name;
  $("restnext").textContent=isLast?(todayEx()[i+1]?"다음 → "+nameOf(i+1):"마지막 종목"):`${s+2}세트 준비`;
  $("rest").classList.add("on");
  clearInterval(timer); tick(); timer=setInterval(tick,1000);
}
function startTimer(sec,name,note){
  span=sec; endAt=Date.now()+sec*1000;
  $("restname").textContent=name; $("restnext").textContent=note;
  $("rest").classList.add("on");
  clearInterval(timer); tick(); timer=setInterval(tick,1000);
}
function tick(){
  const left=leftSec(), t=$("resttime"), v=Math.abs(left);
  t.textContent=(left<0?"+":"")+Math.floor(v/60)+":"+String(v%60).padStart(2,"0");
  t.classList.toggle("over",left<=0);
  $("restline").style.width=Math.max(0,Math.min(100,left/span*100))+"%";
  if(left<-180) stopRest();
}
function stopRest(){ clearInterval(timer);timer=null;$("rest").classList.remove("on"); }
$("skip").addEventListener("click",stopRest);
$("plus30").addEventListener("click",()=>{ endAt+=30000; span+=30; tick(); });
// 돌아온 순간 바로 맞는 값을 보여준다 — 다음 tick 을 1초 기다리지 않는다
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&timer) tick(); });

$("finish").addEventListener("click",async()=>{
  const date=today(), m=monthOf(date), day=curDay;
  /* 같은 화면 상태를 다시 저장하는 것이면 새 세션을 만들지 않고 그 세션을 갱신한다.
     id 를 매번 새로 뽑으면 중복 제거가 죽은 코드가 되어, 저장 실패 후 재시도할 때마다
     같은 날짜의 세션이 쌓이고 counts 와 rotation.cycles 까지 두 번씩 오른다. */
  const again = savedRec && savedRec.date===date && savedRec.day===day;
  /* 웜업·마무리는 이미 blocks 로 받고 있었는데 저장 때 버려지고 있었다 (SPEC 4-2).
     SCHEMA 예시는 Day 1 기준의 고정 키(foamRoll 등)인데, 프로그램이 편집 가능하므로
     그 키를 보장할 수 없다. 실제로 체크한 항목 이름과 분을 담는다. */
  const d0=D();
  const wOn=Object.keys(blocks.w||{}).filter(k=>blocks.w[k]).map(Number);
  const fOn=!!(blocks.f&&blocks.f[0]);
  // 시각은 어디에도 남기지 않는다 — id 는 날짜 + 4자리 무작위, 시간은 durationSec 하나 (SCHEMA)
  const rec={id: again?savedRec.id:newId("w",date), date,
             durationSec: startMark?Math.max(0,Math.round((Date.now()-startMark)/1000)):null,
             day, title:d0.title, note:(note||"").trim(),
             warmup:{done:wOn.map(k=>(d0.warmup[k]||[])[0]).filter(Boolean),
                     min:Math.round(wOn.reduce((a,k)=>a+((d0.warmup[k]||[])[2]||0),0)/60)},
             finisher: fOn?{name:d0.finish.name, min:Math.round(d0.finish.sec/60)}:null,
             /* 건너뛴 종목을 기록에 남긴다 (필드 추가 · 마이그레이션 아니다).
                exercises 에는 여전히 안 넣는다 — 안 한 것은 기록이 아니다 (SCHEMA).
                다만 이름은 남겨야 한다. 예전에는 sessionSkip(세션 상태)에서만 읽었는데
                그건 「초기화」를 누르면 사라져서, 밤에 만드는 「오늘 마무리」 프롬프트가
                건너뛴 종목을 통째로 잃었다 (11회차). 코치가 볼륨이 왜 줄었는지 알아야 한다.
                옛 기록에는 이 필드가 없다 — 읽는 쪽이 [] 로 받는다 */
             skipped: todayEx().map((e,i)=>sessionSkip[i]?nameOf(i):null).filter(Boolean),
             exercises:[], rev: again?(savedRec.rev+1):1};
  todayEx().forEach((e,i)=>{
    if(sessionSkip[i]) return;           // 안 한 것은 기록이 아니다
    const name=nameOf(i);
    const arr=(entries[i]||[]).filter(x=>x&&x.done&&x.r);
    if(!arr.length) return;
    rec.exercises.push({
      name,
      // 대체했으면 원래 종목이 planned 에 남는다. 오늘 추가한 종목은 계획에 없었으므로 null
      planned: isAdded(i)?null:e.name,
      targetReps:e.reps, targetRir:e.rir,
      rir:rirs[i]||null,                 // 4-1 · 안 고르면 null 로 두고 넘어간다
      sets:arr.map(x=>({w:x.w||0,r:x.r}))
    });
    /* 쓰기는 언제나 실제 수행 종목 키다. 폴백을 만들다 원래 종목을 덮어쓰면 안 된다.
       sets 는 세트별 무게를 그대로 담는다 — w 하나만 두면 30/35/40kg 처럼 세트마다
       무게를 올린 날의 기록이 "40kg 로 10회" 처럼 거짓이 된다. w·reps 는 하위 호환용으로 남긴다. */
    idx.lastByExercise[name]={
      w:arr[arr.length-1].w||0, reps:arr.map(x=>x.r),
      sets:arr.map(x=>({w:x.w||0,r:x.r})),
      mode:e.mode, rir:rirs[i]||null,
      /* ⚠ === 가 아니라 >= 다. 계획 3세트인데 오늘 4세트를 하면 === 에서는 거짓이 되어
         네 세트 전부 목표 상단을 채워도 증량 제안이 사라진다. 더 했는데 벌을 받는 셈이다.
         >= 면 줄였을 때는 여전히 거짓이라 "계획만큼 채워야 증량"이라는 원래 의도는 지켜진다.
         비교 대상은 언제나 계획 세트 수(e.sets)다 — 오늘 줄인 값이 아니다. */
      allTop:arr.length>=e.sets&&arr.every(x=>x.r>=e.top), date};
    /* 그 자리의 마지막 대체를 기억한다 (SPEC 4-8). 되돌렸으면 기억도 지운다 —
       안 지우면 원래 종목으로 돌아갈 방법이 없어진다. 오늘 추가한 종목은 자리가 없다. */
    if(!isAdded(i)){
      if(name!==e.name) idx.swapMemory[e.name]=name;
      else delete idx.swapMemory[e.name];
    }
  });

  const mo=getMonth(m);
  const at=mo.sessions.findIndex(s=>s.id===rec.id);
  if(at>=0) mo.sessions[at]=rec; else mo.sessions.push(rec);
  mo.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  if(!idx.months.includes(m)){ idx.months.push(m); idx.months.sort(); }
  if(!again){ idx.counts.sessions++; applyRotation(day,date); }   // 갱신일 때는 두 번 세지 않는다
  idx.rev++;

  const r1 = await writeJSON(K.month(m),mo);     // storageOK 로 막지 않는다 — 성공하면 래치가 풀린다
  const r2 = r1.ok ? await writeJSON(K.index,idx) : r1;
  const r  = r1.ok ? r2 : r1;
  const ok = r.ok;
  const nSets = doneSets();
  if(ok){
    /* 화면은 그대로 둔다 — 방금 기록한 것을 다시 볼 수 있어야 한다.
       대신 sessionSaved 로 표시해 드래프트를 남기지 않는다. 안 그러면 앱을 다시 열 때
       끝낸 Day 가 "진행 중"으로 되살아나 rotation 을 가로챈다.
       화면을 비우는 것은 「초기화」 버튼이 맡는다. 실패했을 때는 아무것도 건드리지 않는다. */
    sessionSaved=true; savedRec={id:rec.id,date,day,rev:rec.rev};
    clearDraft();
    await promoteAdds();               // 「이 Day 프로그램에도 넣기」를 켠 종목을 여기서 계획으로 옮긴다
    $("saved").textContent=`저장됨 · ${date} Day ${day} · ${nSets}세트 — 다음은 Day ${nextDay()}`;
    $("saved").className="saved";
    $("reset").style.display="block";
  }else{
    $("saved").innerHTML=`<span class="err">저장 실패 — ${r.err||"원인 미상"}<br>화면의 기록은 그대로 있습니다. 아래 <b>기록 백업</b>을 눌러 텍스트로 복사해두세요.</span>`;
  }
  showCoach(rec);
  /* 코칭 상자로 스크롤하면 그 바로 48px 위의 「초기화」 버튼이 화면 밖으로 밀려
     "초기화 버튼이 어디 갔냐"가 된다. 한 칸 위인 저장 메시지에 맞추면 둘 다 보인다. */
  setTimeout(()=>(ok?$("saved"):$("coachbox")).scrollIntoView({behavior:"smooth",block:"start"}),200);
  stopRest(); renderOverview(); renderBrief(); renderBlocks(); render(); renderEditor();
});

/* 「초기화」 — 저장한 세션을 화면에서 지우고 다음 Day 로 넘어간다.
   저장 후 화면을 그대로 두기로 했으므로 넘어가는 동작이 명시적으로 필요하다. */
$("reset").addEventListener("click",()=>{
  if(!sessionSaved && doneSets()>0 && !confirm("아직 저장하지 않은 기록이 있습니다. 지우고 초기화할까요?")) return;
  entries={}; swaps={}; blocks={}; sessionSaved=false; savedRec=null;
  clearSession(); renderAddSheet();
  clearDraft();
  curDay=nextDay();
  seedSwaps(); prevOpen=false;
  $("saved").textContent=""; $("reset").style.display="none";
  $("coachbox").style.display="none"; $("backup").style.display="none";
  stopRest(); renderOverview(); renderBrief(); renderBlocks(); render();
  $("brief").scrollIntoView({behavior:"smooth",block:"start"});
});

/* 클립보드 텍스트는 둘이다 (SCHEMA 「클립보드 텍스트 — 두 번째 계약」).
   길이와 용도가 다르므로 같은 것을 두 자리에 쓰면 안 된다.

     코칭 프롬프트 — 세션 끝날 때마다. 오늘 + 같은 Day 직전 2회 + 맥락. 짧을수록 좋다
     백업 내보내기 — 가끔. 전체 이력 + 프로그램. 길어도 된다

   예전에는 백업 하나가 두 자리를 겸했다. 세션이 쌓일수록 매번 보는 텍스트가 길어져
   실사용에서 못 쓰게 된다 — 2세션 만에 60줄이 됐다. 그래서 분리한다. */
const RIRTXT={easy:"여유있었음",ontarget:"딱맞았음",limit:"한계였음"};
/* 주차 — SCHEMA 「코칭 프롬프트」가 요구하는 항목이다. 6주차면 조언이 달라진다.
   다만 디로드 판정은 여전히 바퀴 수 기준이다 (달력 주차가 아니다). */
function weekNo(){
  const s=idx&&idx.programStart; if(!s) return null;
  const d=Math.floor((new Date(today())-new Date(s))/86400000);
  return d>=0 ? Math.floor(d/7)+1 : null;
}
/* 바퀴 — 누적 세션 ÷ Day 수 (내림).
   ⚠ rotation.cycles 를 쓰지 않는다. 그 값은 applyRotation 이 마지막 Day 를 했을 때만
   올리는데, 총정리에서 Day 를 직접 골라 할 수 있어서 Day 5 를 건너뛰면 바퀴가 영영
   0 이고 디로드 권고(6바퀴)가 절대 안 뜬다. 11회차에 실사용 프롬프트가
   `0바퀴 · 누적 5세션` 으로 나와 드러났다.
   HANDOFF 「디로드는 바퀴 수 기준」의 근거가 원래 "누적 부하는 세션 수를 따라간다" 였다.
   Day 1 을 두 번 해도 몸이 받은 세션은 쌓였으니 이쪽이 의도에 맞는다.
   rotation.cycles 필드는 SCHEMA 계약이라 그대로 두고 표시·판정만 유도값을 쓴다. */
function cyclesDone(){
  const len=(PROG()||[]).length||1;
  const n=(idx&&idx.counts&&idx.counts.sessions)||0;
  return Math.floor(n/len);
}
/* ⚠ 파서는 `종목명: NNkg x NN` 한 줄 문법만 안다 (SCHEMA 「파싱 규칙」).
   여기 덧붙이는 줄들은 `kg x` 패턴이 없어 자동으로 건너뛰어진다. 헤더 뒤에 붙는 것도
   정규식이 날짜와 Day 만 잡으므로 안전하다. 이 성질을 깨뜨리지 말 것. */
function sessionLines(s){
  const dur=s.durationSec>=60?` · ${Math.round(s.durationSec/60)}분`:"";   // 1분 미만은 노이즈다
  const out=[`[${s.date}] Day ${s.day} · ${s.title||""}${dur}`.replace(/ · $/,"")];
  (s.exercises||[]).forEach(x=>{
    const tail=[];
    if(x.rir&&RIRTXT[x.rir]) tail.push(RIRTXT[x.rir]);
    if(x.planned&&x.planned!==x.name) tail.push(`대체(${x.planned})`);
    out.push(`${x.name}: ${(x.sets||[]).map(v=>`${v.w||0}kg x ${v.r}`).join(", ")}`
             + (tail.length?` · ${tail.join(" · ")}`:""));
  });
  const w=s.warmup&&s.warmup.done&&s.warmup.done.length
        ? `웜업: ${s.warmup.done.join(", ")}${s.warmup.min?` (${s.warmup.min}분)`:""}` : "";
  const f=s.finisher&&s.finisher.name ? `마무리: ${s.finisher.name} ${s.finisher.min}분` : "";
  if(w||f) out.push([w,f].filter(Boolean).join(" · "));
  if(s.note) out.push(`메모: ${s.note}`);
  return out;
}
function programLines(){
  const out=[`--- 프로그램 (${program.basedOn} 기준 · rev ${program.rev}) ---`];
  PROG().forEach(d=>{
    out.push(`Day ${d.n} · ${d.title} · ${d.ex.length}종목 ${d.ex.reduce((a,e)=>a+e.sets,0)}세트`);
    d.ex.forEach((e,i)=>out.push(
      `${i+1}. ${e.name} | ${e.sets}x${e.reps} | RIR ${e.rir} | 휴식 ${e.rest} | +${e.inc}kg | ${e.equip}`));
  });
  return out;
}
/* 러닝 한 줄 (SCHEMA 「백업 내보내기」 예시 형식).
   ⚠ 파서 안전 — `kg x` 패턴이 없어 자동으로 건너뛰어진다 (SCHEMA 「파싱 규칙」).
   `km` 이지 `kg` 가 아니다. 이 성질을 깨뜨리지 말 것. */
const runLine=r=>`[${r.date}] 러닝: ${(+r.km).toFixed(2)}km ${hms(+r.sec)} ${mmss(paceOf(+r.km,+r.sec))}/km ${RTYPE[r.type]||r.type||""}`
  +(r.hr?` · 심박 ${r.hr}`:"")+(r.cadence?` · 케이던스 ${r.cadence}`:"")+(r.note?` · ${r.note}`:"");
function logText(){
  const lines=["WORKOUT-EXPORT v2","",...programLines(),"","--- 기록 ---"];
  const all=allSessions();
  /* 러닝도 백업에 담는다. 7단계 전까지 텍스트가 유일한 복구 수단인데
     러닝만 빠져 있으면 폰이 죽었을 때 러닝 이력이 통째로 사라진다 (CLAUDE.md 원칙 3).
     세션과 날짜순으로 섞어 그날 무엇을 했는지 한 자리에서 보이게 한다. */
  const items=all.map(s=>({date:s.date,ls:()=>sessionLines(s)}))
    .concat(allRuns().map(r=>({date:r.date,ls:()=>[runLine(r)]})))
    .sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  if(items.length) items.forEach((it,i)=>{ if(i) lines.push(""); lines.push(...it.ls()); });
  else lines.push("(아직 저장된 세션이 없습니다)");
  /* 「누적 기록」 섹션은 없앴다. 「기록」이 이미 같은 내용을 담고 있어 길이만 두 배가 되고,
     종목당 무게를 하나만 담아 세트별로 무게를 바꾼 날의 기록이 뭉개졌다.
     파서를 first-wins 로 바꿨으므로 최신순 「기록」만으로 정확히 복원된다.
     「기록」에 없는 종목(옛 텍스트로만 복원해 둔 것)이 있으면 그것만 덧붙인다. */
  const inLog=new Set(all.flatMap(s=>(s.exercises||[]).map(x=>x.name)));
  const orphan=Object.keys(idx.lastByExercise).filter(k=>!inLog.has(k));
  if(orphan.length){
    lines.push("", "--- 세션 기록이 없는 종목 ---");
    orphan.forEach(k=>{
      const l=idx.lastByExercise[k];
      const was=(l.was&&l.was.length)?` (옛 이름: ${l.was.join(", ")})`:"";
      const pairs=(l.sets&&l.sets.length)?l.sets.map(v=>`${v.w||0}kg x ${v.r}`)
                                         :(l.reps||[]).map(r=>`${l.w||0}kg x ${r}`);
      lines.push(`${k}: ${pairs.join(", ")}${was}`);
    });
  }
  return lines.join("\n");
}
// 백업 텍스트를 되읽어 지난 기록을 복원한다 (저장소가 없어도 동작)
/* ⚠ first-wins 다. 「기록」이 최신순으로 나열되므로 처음 만난 줄이 가장 최근 기록이다.
   예전처럼 나중 것이 이기게 두면 가장 오래된 세션의 값이 최종으로 남는다.
   같은 이유로 day 도 첫 헤더에서 잡는다 — 마지막 헤더는 가장 오래된 세션이다.
   v1 옛 텍스트는 종목당 한 줄뿐이라 first-wins 여도 결과가 같다. */
function parseBackup(text){
  let firstDay=null, date=null;
  const planTop={};
  PROG().forEach(d=>d.ex.forEach(e=>{ planTop[e.name]=[e.top,e.sets]; }));
  const got={};
  text.split("\n").forEach(raw=>{
    const line=raw.trim();
    if(line.startsWith("---")){ date=null; return; }   // 구분선을 지나면 날짜 문맥이 끊긴다
    if(!line) return;
    const h=line.match(/^\[([^\]]*)\]\s*Day\s*(\d+)/);
    if(h){
      if(firstDay===null) firstDay=+h[2];
      const dt=h[1].trim(); date=/^\d{4}-\d{2}-\d{2}$/.test(dt) ? dt : null;
      return; }
    /* 기록 줄은 언제나 `종목명: ...` 이고 `[` 로 시작하지 않는다.
       `[` 로 시작하는 줄은 헤더(위에서 처리)이거나 러닝 줄이다. 여기서 끊지 않으면
       러닝 메모에 "5kg x 10" 같은 글자가 들어갔을 때 "[날짜] 러닝" 이라는
       엉뚱한 종목이 lastByExercise 에 생긴다. */
    if(line.startsWith("[")) return;
    const i=line.indexOf(":");
    if(i<1) return;
    const name=line.slice(0,i).trim();
    if(got[name]) return;                              // 먼저 나온 것(=최신)이 이긴다
    const tail=line.slice(i+1);
    const pairs=[...tail.matchAll(/(\d+(?:\.\d+)?)\s*kg\s*x\s*(\d+)/g)];
    if(!pairs.length) return;
    const sets=pairs.map(p=>({w:+p[1], r:+p[2]}));     // 세트별 무게를 그대로 살린다
    const reps=sets.map(v=>v.r);
    // RIR 은 텍스트에 `· 한계였음` 으로 나가 있는데 예전에는 되읽지 않아 왕복에서 손실됐다
    let rir=null;
    Object.keys(RIRTXT).forEach(k=>{ if(tail.includes(RIRTXT[k])) rir=k; });
    const t=planTop[name];
    /* ⚠ === 가 아니라 >= 다. 저장 경로(allTop)와 같은 규칙이어야 한다 —
       계획 3세트인데 4세트를 전부 상단으로 채운 날을 백업에서 복원하면
       === 에서는 증량 제안이 사라진다. 더 했는데 벌을 받는 셈이다. */
    got[name]={w:sets[sets.length-1].w, reps, sets, rir, date,
      allTop: !!(t && reps.length>=t[1] && reps.every(r=>r>=t[0]))};
  });
  Object.entries(got).forEach(([name,v])=>{
    const prev=idx.lastByExercise[name];
    // 헤더가 없어 날짜를 모르면, 이미 알고 있던 날짜를 null 로 낮추지 않는다
    idx.lastByExercise[name]={...v, date: v.date || (prev&&prev.date) || null};
  });
  return {count:Object.keys(got).length, day:firstDay};
}
/* ⚠ iOS 클립보드 — writeText 는 사용자 제스처 안에서 즉시 호출돼야 한다.
   앞에 다른 await 가 끼면 권한이 만료돼 조용히 실패한다.
   문자열은 동기적으로 다 만들어 두고 writeText 를 첫 await 로 둔다. */
function bindCopy(btnId,textId){
  $(btnId).addEventListener("click",async()=>{
    const t=$(textId), btn=$(btnId), label=btn.textContent;
    try{ await navigator.clipboard.writeText(t.value); btn.textContent="복사됨"; }
    catch(e){ t.select(); document.execCommand&&document.execCommand("copy"); btn.textContent="복사됨 (길게 눌러 복사도 가능)"; }
    setTimeout(()=>{ btn.textContent=label; },2500);
  });
}
function showBackup(){
  const box=$("backup");

  box.innerHTML=`<textarea id="baktext" readonly rows="9">${esc(logText())}</textarea>
    <button class="coachbtn" id="bakcopy" style="background:var(--brass);color:#2B2836;border-color:var(--brass)">한 번에 복사하기</button>
    <div class="bakhint">메모 앱에 붙여두세요. 맨 위 "지난 기록 불러오기"에 그대로 붙여넣으면 복원됩니다.</div>`;
  bindCopy("bakcopy","baktext");
}

/* 코칭 프롬프트 — 세션 끝날 때마다 쓰는 것. 이력이 쌓여도 길이가 일정하다.
   담을 항목은 SCHEMA 「코칭 프롬프트」 표를 따른다. 러닝(6단계)과 RIR(4-1)은
   아직 데이터가 없어 빠져 있고, 생기면 여기에 줄을 더한다. */
/* 러닝 한 줄 (프롬프트용) — 백업의 runLine 과 다르다. 저기엔 `러닝:` 이 붙고
   케이던스·메모까지 담긴다. 여기는 코치가 판단에 쓰는 것만 담는다.
   ⚠ `km` 이지 `kg x` 가 아니라 파서가 건드리지 않는다 (SCHEMA 「파싱 규칙」). */
const runPromptLine=r=>`[${r.date}] ${(+r.km).toFixed(2)}km ${hms(+r.sec)} ${mmss(paceOf(+r.km,+r.sec))}/km ${RTYPE[r.type]||r.type||""}`
  +(r.hr?` · 심박 ${r.hr}`:"");
/* 「이번 주 러닝」 한 줄. ⚠ `주 N일차` 를 반드시 같이 준다 —
   주 초반에는 누적이 언제나 목표에 못 미치는데, 그 줄만 보면 코치가 「미달」로 읽는다.
   월요일 아침 세션이면 언제나 `0.0km · 0회` 다 (11회차에 실사용에서 나온 지적). */
function weekRunLine(dateIso){
  const s=weekStats(isoMonday(dateIso));
  const nth=Math.round((dateOf(dateIso)-dateOf(isoMonday(dateIso)))/86400000)+1;
  return `${s.km.toFixed(1)}km · ${s.n}회 · 주 ${nth}일차 (목표 ${RUN_WEEK_TARGET}km)`;
}
/* 「오늘 Day의 목표」 블록 — 두 프롬프트가 같이 쓴다 */
function goalLines(rec){
  const d=PROG()[rec.day-1]||D();
  return (rec.exercises||[]).map(x=>{
    // 오늘 추가한 종목은 계획에 없다 (planned:null). sessionAdds 에서 찾고 그렇게 표시한다
    const e=d.ex.find(z=>z.name===x.planned)||d.ex.find(z=>z.name===x.name)
          ||sessionAdds.find(z=>z.name===x.name);
    /* 실제 수행 세트 수가 계획과 다르면 반드시 밝힌다. 목표만 "2세트" 라고 적고
       기록에 3세트가 있으면 코치가 볼륨 변화를 계획 변경으로 오해한다. */
    const n=(x.sets||[]).length;
    if(!e) return `${x.name}: 계획 외 종목 · 오늘 ${n}세트 수행`;
    return `${x.name}: 목표 ${e.sets}x${e.reps} RIR ${e.rir} (증량단위 ${e.inc}kg)`
         + (n!==e.sets?` · 오늘 ${n}세트 수행`:"")
         + (x.planned===null?" · 오늘 추가한 종목":"");
  });
}
/* 건너뛴 종목도 코칭 재료다 — 볼륨이 왜 줄었는지 알아야 조언이 맞는다.
   ⚠ 기록(rec.skipped)에서 읽는다. 세션 상태(sessionSkip)는 「초기화」로 사라져서
   밤에 만드는 「오늘 마무리」가 이걸 잃었다. 옛 기록에는 필드가 없다 → [] */
const skippedOf=rec=>(rec&&rec.skipped)||[];

function coachText(rec){
  const goal=goalLines(rec);
  const skipped=skippedOf(rec);
  // 같은 Day 직전 2회 — 오늘 것은 뺀다
  const prev=allSessions().filter(s=>s.day===rec.day&&s.id!==rec.id).slice(0,2);
  const L=[
    `아래는 오늘 웨이트 세션 기록이다. 다음에 같은 Day를 할 때 무엇을 바꿔야 하는지 코칭하라.`,
    ``,
    `[오늘 · ${rec.date} Day ${rec.day} ${rec.title}${rec.durationSec>=60?` · ${Math.round(rec.durationSec/60)}분`:""}]`,
    ...sessionLines(rec).slice(1),
    ``,
    `[오늘 Day의 목표]`,
    ...(goal.length?goal:["(없음)"]),
    ``,
    // 건너뛴 종목은 목표 목록에 섞지 않는다 — 붙여 두면 목표의 일부로 읽힌다
    ...(skipped.length?[`[오늘 하지 않은 종목]`, skipped.join(", "), ``]:[]),
    `[같은 Day 이전 기록]`,
    ...(prev.length?prev.flatMap(s=>{
      const ls=sessionLines(s);
      // 같은 날 두 번 저장한 것을 "이전"으로 읽으면 추이 판단이 어긋난다
      if(s.date===rec.date) ls[0]+=" (오늘 앞서 한 세션)";
      return ls;
    }):["이전 기록 없음"]),
    ``,
    /* [최근 러닝 3회] — SCHEMA 「코칭 프롬프트」 계약의 마지막 항목이다 (6단계).
       이게 없으면 하체 정체의 원인을 영영 무게 문제로만 보게 된다.
       ⚠ `km` 이지 `kg x` 가 아니라서 백업 파서가 이 줄을 건드리지 않는다. 깨뜨리지 말 것. */
    `[최근 러닝 3회]`,
    ...(()=>{ const l=allRuns().slice(0,3);
      return l.length?l.map(runPromptLine):["러닝 기록 없음"]; })(),
    /* ⚠ 시점을 밝힌다. 웨이트는 아침·낮이고 러닝은 밤이라 이 프롬프트를 만드는 시점에
       오늘 밤 러닝은 **언제나** 없다. 그걸 안 적으면 코치가 「오늘 안 뛰었나」로 읽는다
       (11회차에 실사용에서 나온 지적). 이미 오늘 러닝이 있으면 이 줄은 안 붙인다.
       `kg x` 가 없어 파서가 건너뛴다 — 이 성질을 깨뜨리지 말 것 */
    ...(allRuns().some(r=>r.date===rec.date)?[]:
        [`러닝은 밤에 한다 — 이 기록은 웨이트를 저장한 시점이라 오늘 밤 러닝은 아직 없다.`]),
    ``,
    `[이번 주 러닝]`,
    weekRunLine(rec.date),
    ``,
    `[진행 상황]`,
    (weekNo()?`${weekNo()}주차 · `:"") +
      `${cyclesDone()}바퀴 · 누적 ${idx.counts.sessions}세션` +
      (cyclesDone()>=6?" · 디로드 권고 구간":""),
    ``,
    `[사용자 상황]`,
    CONTEXT,
    ``,
    `[진행 규칙]`,
    `이중 점진 — 목표 반복 범위 상단을 전 세트 달성하면 다음에 한 단계 증량. 상단에 못 미치면 같은 중량 유지. 실패 지점까지 밀지 않는다. 무게 0kg은 머신 기본 무게 또는 빈 봉을 뜻한다.`,
    ``,
    `[답변 형식]`,
    `한국어로. 항목당 한 줄, 최대 4줄. "종목명 — 다음 조치" 형태로 구체적 숫자 포함. 마지막 한 줄로 전반 코멘트. 인사말 없이 바로 시작. 마크다운 기호 금지.`
  ];
  return L.join("\n");
}
/* ══ 「오늘 마무리」 프롬프트 (11회차) ══════════════════════════════════
   러닝까지 끝내고 하루를 닫을 때 쓴다. 세션 프롬프트와 무엇이 다른가 —
     · 세션 프롬프트는 저장 시점(아침·낮)이라 **오늘 밤 러닝이 아직 없다.** 여기엔 있다
     · 그날 웨이트를 두 번 했으면 둘 다 담는다 (오래된 것부터)
     · 웨이트를 안 한 날은 러닝만 담고 세션 블록을 통째로 뺀다
   ⚠ 둘 중 **하나만** 보내면 된다. 앱은 어느 쪽도 강요하지 않는다.
   ⚠ 새로 더하는 줄에 `kg x` 패턴이 없어야 한다 (SCHEMA 「파싱 규칙」). */
function finishText(dateIso){
  const date=dateIso||today();
  const ses=allSessions().filter(s=>s.date===date);     // 최신이 먼저다
  const runs=allRuns().filter(r=>r.date===date);
  const hasW=ses.length>0;
  const L=[ hasW
      ? `아래는 오늘 하루 운동 기록이다. 웨이트와 러닝을 같이 놓고, 다음에 같은 Day를 할 때 무엇을 바꿔야 하는지 코칭하라.`
      : `아래는 오늘 러닝 기록이다. 이날은 웨이트를 하지 않았다. 러닝만 놓고 짧게 코멘트하라.`,
    `` ];
  if(hasW){
    const main=ses[ses.length-1];                       // 그날 첫 세션이 기준이다
    L.push(`[오늘 웨이트]`);
    // 오래된 것부터 읽히게 뒤집는다 — 「앞서 한 세션」이 먼저 와야 순서가 맞는다
    ses.slice().reverse().forEach((s,k)=>{ if(k) L.push(``); L.push(...sessionLines(s)); });
    L.push(``, `[오늘 Day의 목표]`, ...(goalLines(main).length?goalLines(main):["(없음)"]), ``);
    // 건너뛴 종목은 목표 목록에 섞지 않는다 — 붙여 두면 목표의 일부로 읽힌다
    const sk=ses.flatMap(skippedOf);
    if(sk.length) L.push(`[오늘 하지 않은 종목]`, sk.join(", "), ``);
    const prev=allSessions().filter(s=>s.day===main.day&&s.date!==date).slice(0,2);
    L.push(`[같은 Day 이전 기록]`, ...(prev.length?prev.flatMap(sessionLines):["이전 기록 없음"]), ``);
  }
  L.push(`[오늘 러닝]`, ...(runs.length?runs.map(runPromptLine):["러닝 기록 없음"]), ``);
  // 오늘 것은 위 블록에 있다. 여기서 또 보여주면 같은 줄이 두 번 온다
  const before=allRuns().filter(r=>r.date<date).slice(0,3);
  L.push(`[오늘 이전 러닝 3회]`, ...(before.length?before.map(runPromptLine):["이전 러닝 기록 없음"]), ``);
  L.push(`[이번 주 러닝]`, weekRunLine(date), ``);
  if(hasW){
    L.push(`[진행 상황]`,
      (weekNo()?`${weekNo()}주차 · `:"") + `${cyclesDone()}바퀴 · 누적 ${idx.counts.sessions}세션`
      + (cyclesDone()>=6?" · 디로드 권고 구간":""), ``);
  }
  L.push(`[사용자 상황]`, CONTEXT, ``);
  if(hasW){
    L.push(`[진행 규칙]`,
      `이중 점진 — 목표 반복 범위 상단을 전 세트 달성하면 다음에 한 단계 증량. 상단에 못 미치면 같은 중량 유지. 실패 지점까지 밀지 않는다. 무게 0kg은 머신 기본 무게 또는 빈 봉을 뜻한다.`, ``);
  }
  L.push(`[답변 형식]`, hasW
    ? `한국어로. 항목당 한 줄, 최대 4줄. "종목명 — 다음 조치" 형태로 구체적 숫자 포함. 러닝이 하체 회복에 걸리면 그것부터 짚을 것. 마지막 한 줄로 전반 코멘트. 인사말 없이 바로 시작. 마크다운 기호 금지.`
    : `한국어로. 최대 2줄. 러닝 부하와 주간 누적만 보고 코멘트. 웨이트 조언은 하지 말 것. 인사말 없이 바로 시작. 마크다운 기호 금지.`);
  return L.join("\n");
}
/* 러닝을 저장하면 뜬다. ⚠ 웨이트를 안 한 날에는 **강조하지 않는다** —

/* ══ 러닝 (SPEC 6단계 · SCHEMA 「러닝」·「입력 형식」) ══════════════════
   웨이트는 Day 순환이지만 러닝은 날짜별 독립 기록이다. 같은 날 둘 다 있을 수 있다.
   애플 건강 연동은 하지 않는다 — 걷기 거리와 종일 심박이 섞여 데이터 품질이 떨어진다.
   검토 후 내린 결정이니 되살리지 말 것 (CLAUDE.md 원칙 3-1). */
const RUN_WEEK_TARGET=25;               // PROGRAM.md 의 주 25km. 편집 화면은 만들지 않는다
const RTYPE={easy:"이지",normal:"평소",long:"롱런",interval:"인터벌"};
const RCLASS={easy:"",normal:"",long:"long",interval:"int"};
const RUN_PAGE=30;                      // 1년이면 260개다. 한 번에 다 그리면 느려진다
let runType="easy", runShown=RUN_PAGE;
/* 4-9 — 저장한 러닝을 고치고 지운다. 러닝은 주 5회 입력이라 오타 하나가
   주간 누적을 영구히 틀리게 만든다. editRunId 가 null 이면 새로 쓰는 것이다.
   ⚠ 날짜는 고치지 못하게 한다 — 바꾸면 주간 집계가 두 주에 걸치고 월 파일까지
   옮겨야 한다. 오타는 값이지 날짜가 아니다. */
let editRunId=null, warnAck=false, delArm=null;
/* 비정상 값 경고 (SPEC 4-9 ①). ⚠ **페이스가 가장 강한 그물이다** —
   거리만 보면 시간 오타를 놓친다. 5000→50.00km 는 0:32/km 로, 2631 을 231 로 친 것은
   0:30/km 로 잡힌다. 하나로 둘 다 걸린다.
   막지 않고 확인만 받는다. 인터벌·롱런은 실제로 범위를 벗어난다. */
const PACE_MIN=120, PACE_MAX=900;        // 2:00/km ~ 15:00/km
function runWarn(km,sec,skipId){
  const p=paceOf(km,sec);
  if(p&&p<PACE_MIN) return `페이스가 ${mmss(p)}/km 입니다 — 거리나 시간을 잘못 입력하지 않았는지 확인해주세요.`;
  if(p&&p>PACE_MAX) return `페이스가 ${mmss(p)}/km 입니다 — 걷기이거나 시간을 잘못 입력한 것 아닌가요?`;
  // 직전 기록들과 견준다. 첫 기록이면 비교 대상이 없으니 넘어간다
  const past=allRuns().filter(r=>r.id!==skipId).slice(0,30).map(r=>+r.km);
  if(past.length){
    const mx=Math.max.apply(null,past);
    if(mx>0&&km>mx*3) return `지금까지 가장 긴 ${mx.toFixed(2)}km 의 3배가 넘습니다 (${km.toFixed(2)}km). 맞나요?`;
  }
  return null;
}

const dateOf=iso=>{ const p=String(iso).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); };
/* ⚠ 주는 ISO 8601 — 월요일 시작, 일요일 끝이다.
   getDay() 는 일요일이 0 이라 그대로 쓰면 하루 어긋난다. (getDay()+6)%7 로 월=0 을 만든다. */
function isoMonday(iso){ const d=dateOf(iso); d.setDate(d.getDate()-((d.getDay()+6)%7)); return localDate(d); }
function isoWeek(iso){
  const p=String(iso).split("-");
  const t=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7)+3);          // 그 주의 목요일이 해를 정한다
  const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));            // 1월 4일은 언제나 1주차
  f.setUTCDate(f.getUTCDate()-((f.getUTCDay()+6)%7)+3);
  return `${t.getUTCFullYear()}-W${pad(1+Math.round((t-f)/604800000))}`;
}
const weekEnd=mon=>{ const e=dateOf(mon); e.setDate(e.getDate()+6); return localDate(e); };
/* "2026-W34" 만으로는 어디부터 어디까지인지 안 보인다. 범위를 날짜로 적는다 */
function weekRange(mon){
  const s=dateOf(mon), e=dateOf(weekEnd(mon));
  return `${pad(s.getMonth()+1)}.${pad(s.getDate())} ${DOW[s.getDay()]}`
       + ` ~ ${pad(e.getMonth()+1)}.${pad(e.getDate())} ${DOW[e.getDay()]}`;
}
const dowOf=iso=>DOW[dateOf(iso).getDay()];
// ⚠ 나머지를 먼저 반올림하면 59.7초가 "5:60" 이 된다. 총초를 먼저 정수로 만든다
const mmss=sec=>{ const t=Math.round(sec); return `${Math.floor(t/60)}:${pad(t%60)}`; };
function hms(sec){ const t=Math.round(sec), h=Math.floor(t/3600);
  return h?`${h}:${pad(Math.floor(t%3600/60))}:${pad(t%60)}`:`${Math.floor(t/60)}:${pad(t%60)}`; }
// 페이스는 입력받지도 저장하지도 않는다. sec/km 로 언제든 계산된다 (SCHEMA 「러닝」)
const paceOf=(km,sec)=>(km>0&&sec>0)?sec/km:null;

function allRuns(){
  return (idx.months||[]).flatMap(m=>getMonth(m).runs||[])
    .sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);          // 최신이 맨 위
}
const runsInWeek=mon=>{ const e=weekEnd(mon); return allRuns().filter(r=>r.date>=mon&&r.date<=e); };
function weekStats(mon){
  const l=runsInWeek(mon);
  return {km:l.reduce((a,r)=>a+(+r.km||0),0), n:l.length};
}
/* 주간 집계를 index 에 캐시한다 (SCHEMA index.json 「recentRunWeeks」).
   주가 달을 걸치면 월 파일 두 개를 보게 되는데 getMonth 가 캐시라 비용은 없다.
   이건 캐시일 뿐이고 진실은 언제나 월 파일의 runs[] 다. */
function recalcRunWeek(dateIso){
  const mon=isoMonday(dateIso), week=isoWeek(dateIso), s=weekStats(mon);
  const arr=(idx.recentRunWeeks||[]).filter(x=>x&&x.week!==week);
  if(s.n) arr.push({week, km:Math.round(s.km*10)/10, runs:s.n});
  arr.sort((a,b)=>a.week<b.week?1:-1);
  idx.recentRunWeeks=arr.slice(0,8);
}

/* ⚠ 카드 전체가 버튼이다 (4-9). `.rtop` 은 flex-wrap 인데 390px 에서 이미 빠듯해서
   44px 짜리 ⚙ 를 그 줄에 넣으면 6회차 태그 줄과 같은 방식으로 터진다.
   총정리의 `.dayrow` 와 같은 방식이라 새 패턴도 아니다 — 폭 비용 0, 터치 타깃은 카드 전체.
   ⚠ 그래도 「수정」 글자는 남긴다. 글자 없는 조작은 눌러볼 생각을 하지 못한다 (7회차). */
function runCard(r){
  const p=paceOf(+r.km,+r.sec);
  const meta=[r.hr?`♥ ${r.hr}`:"", r.cadence?`🦶 ${r.cadence}`:""].filter(Boolean);
  return `<button class="run" type="button" data-redit="${esc(r.id)}"
      aria-label="${esc(String(r.date))} ${(+r.km).toFixed(2)}km 기록 수정">
    <div class="rtop">
      <span class="rdate">${esc(String(r.date).slice(5).replace("-","."))} (${dowOf(r.date)})</span>
      <span class="rkm n">${(+r.km).toFixed(2)}<i>km</i></span>
      <span class="rtime">${hms(+r.sec)}</span>
      <span class="rtag ${RCLASS[r.type]||""}">${esc(RTYPE[r.type]||r.type||"")}</span>
      ${p?`<span class="rpace">${mmss(p)}/km</span>`:""}
    </div>
    ${meta.length?`<div class="rmeta">${meta.map(x=>`<span>${x}</span>`).join("")}</div>`:""}
    ${r.note?`<div class="rnote">${esc(r.note)}</div>`:""}
    <span class="redit">수정</span>
  </button>`;
}
function renderRun(){
  const mon=isoMonday(today()), cur=weekStats(mon);
  const pm=dateOf(mon); pm.setDate(pm.getDate()-7);
  const prev=weekStats(localDate(pm));
  $("wkrange").textContent=weekRange(mon);
  $("wkgoal").textContent=`목표 ${RUN_WEEK_TARGET}km`;
  $("wkkm").textContent=cur.km.toFixed(1);
  $("wkruns").textContent=`${cur.n}회`;
  $("wkfill").style.width=Math.min(100,cur.km/RUN_WEEK_TARGET*100)+"%";
  $("wklabel").textContent=isoWeek(today());
  $("lastwk").innerHTML=prev.n?`지난주 <b>${prev.km.toFixed(1)}km · ${prev.n}회</b>`:"";

  const all=allRuns();
  if(!all.length){ $("runlist").innerHTML=`<div class="runempty">아직 러닝 기록이 없습니다</div>`; return; }
  // 주 경계에서 가른다 — 일요일에 뛴 것이 지난주로 가는 게 눈에 보여야 한다
  let html="", last=null;
  all.slice(0,runShown).forEach(r=>{
    const m=isoMonday(r.date);
    if(m!==last){ last=m; html+=`<div class="wksep">${m===mon?"이번 주":isoWeek(r.date)}</div>`; }
    html+=runCard(r);
  });
  if(all.length>runShown) html+=`<button class="runmore" type="button" id="runmore">이전 기록 더 보기 (${all.length-runShown})</button>`;
  $("runlist").innerHTML=html;
  const mb=$("runmore");
  if(mb) mb.addEventListener("click",()=>{ runShown+=RUN_PAGE; renderRun(); });
  // 카드 = 수정 진입 (4-9). renderRun 이 목록을 다시 그리므로 여기서 매번 묶는다
  $("runlist").querySelectorAll("[data-redit]").forEach(b=>b.addEventListener("click",()=>{
    const r=allRuns().find(x=>x.id===b.dataset.redit);
    if(r) openRunForm(true,r);
  }));
}

/* ── 입력 — 소수점도 콜론도 치지 않는다 (SCHEMA 「입력 형식」) ──
   숫자만 받아 뒤 2자리를 소수(초)로 민다. 533 → 5.33 · 2631 → 26:31.
   그래서 inputmode 가 numeric 이다 — iOS 숫자 키패드에 기호 키가 없어도 상관없어진다.
   6회차에 하이픈으로 데인 자리와 같은 종류인데, 이번엔 그 성질을 피하지 않고 이용한다. */
function shiftFmt(digits,sepChar){
  let d=digits.replace(/^0+/,""); if(!d) d="0";
  while(d.length<3) d="0"+d;
  return d.slice(0,-2)+sepChar+d.slice(-2);
}
function runDurSec(){
  const p=$("rundur").value.split(":");
  if(p.length!==2) return 0;
  return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);   // 분:초로만 받는다. 표시할 때만 h 를 푼다
}
const runBadSec=()=>{ const p=$("rundur").value.split(":");
  return p.length===2 && (parseInt(p[1],10)||0)>59; };
function bindDigits(el,max,sep){
  el.addEventListener("input",()=>{
    const d=el.value.replace(/\D/g,"").slice(0,max);
    // 다 지우면 0.00 이 아니라 빈칸이어야 한다 — 안 그러면 다시 칠 수가 없다
    el.value=(d&&+d>0)?shiftFmt(d,sep):"";
    el.classList.remove("ghost");
    const e=el.value.length;
    try{ el.setSelectionRange(e,e); }catch(_){}
    runRecalc();
  });
}
function runRecalc(){
  const km=parseFloat($("runkm").value)||0;
  const bad=runBadSec(), sec=bad?0:runDurSec(), p=paceOf(km,sec);
  const el=$("runpace");
  if(p){ el.textContent=mmss(p)+"/km"; el.className="v"; }
  else { el.textContent="—"; el.className="v none"; }
  $("rundur").classList.toggle("bad",bad);
  $("runerr").textContent=bad?"초는 59 까지입니다. 1시간이 넘으면 분으로 이어 치세요 — 6218 → 62:18":"";
  $("runsave").disabled=!(km>0&&sec>0);
  // 값이 바뀌면 경고 확인은 무효다 — 안 그러면 고친 값이 검사 없이 들어간다
  warnAck=false; $("runwarn").hidden=true; disarmDel();
  $("runsave").textContent=editRunId?"수정 저장":"저장";
}
/* 삭제는 두 번 눌러야 한다. confirm() 은 쓰지 않는다 —
   브라우저 자동화가 멈추고(NEXT-SESSION 4절) iOS 모달도 손에 안 맞는다 */
function disarmDel(){ if(delArm){ clearTimeout(delArm); delArm=null; }
  const b=$("rundel"); if(b){ b.classList.remove("arm"); b.textContent="삭제"; } }
function resetRunForm(){
  // 프리필은 5.00 고정이고 회색이다. 「직전 값」이 아니다 — 밤 러닝이 5km 고정이라
  // 롱런 다음 날 10.9 가 떠서 매번 지워야 했다 (2026-08-17 정정)
  $("runkm").value="5.00"; $("runkm").classList.add("ghost");
  $("rundur").value=""; $("rundur").classList.remove("bad");
  $("runhr").value=""; $("runcad").value=""; $("runnote").value="";
  runType="easy";
  document.querySelectorAll("#runform .chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.rtype==="easy")));
  runRecalc();
}
/* rec 를 주면 수정 모드다. 폼을 새로 만들지 않고 이것 하나를 재사용한다 —
   두 벌이 되면 숫자만 받기·초 59 검사·페이스 자동이 반드시 어긋난다 (4-9) */
function openRunForm(on,rec){
  $("runform").hidden=!on;
  editRunId=(on&&rec)?rec.id:null;
  $("addrun").textContent=on&&!rec?"− 닫기":"+ 오늘 러닝 기록";
  $("rundel").hidden=!(on&&rec);
  $("runedithead").hidden=!(on&&rec);
  disarmDel();
  if(!on){ renderRun(); return; }
  // 새로 입력하려고 열면 지난 마무리 프롬프트는 치운다. 옛 내용이 남아 있으면 그걸 복사한다
  $("runcoach").style.display="none"; $("runsaved").textContent="";
  if(rec){
    $("runedithead").textContent=`${rec.date} 기록 수정 · 날짜는 바꿀 수 없습니다`;
    $("runkm").value=(+rec.km).toFixed(2); $("runkm").classList.remove("ghost");
    $("rundur").value=mmss(+rec.sec); $("rundur").classList.remove("bad");
    $("runhr").value=rec.hr||""; $("runcad").value=rec.cadence||""; $("runnote").value=rec.note||"";
    runType=rec.type||"easy";
    document.querySelectorAll("#runform .chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.rtype===runType)));
    runRecalc();
    $("runform").scrollIntoView({behavior:"smooth",block:"center"});
  }else{ resetRunForm(); $("rundur").focus(); }
}

function bindRun(){
  bindDigits($("runkm"),4,".");        // 최대 99.99
  bindDigits($("rundur"),5,":");       // 최대 999:59
  $("runkm").addEventListener("focus",()=>{ $("runkm").classList.remove("ghost"); $("runkm").select(); });
  // 「+ 오늘 러닝 기록」은 언제나 **새로 쓰기**다. 수정 중에 눌러도 새 입력으로 바뀐다
  $("addrun").addEventListener("click",()=>openRunForm($("runform").hidden||!!editRunId));
  $("runcancel").addEventListener("click",()=>openRunForm(false));
  $("rundel").addEventListener("click",delRun);
  document.querySelectorAll("#runform .chip").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll("#runform .chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    runType=b.dataset.rtype;
  }));
  $("runform").addEventListener("submit",saveRun);
  document.querySelectorAll(".axis button").forEach(b=>b.addEventListener("click",()=>setAxis(b.dataset.ax)));
}
async function saveRun(e){
  e.preventDefault();
  const km=parseFloat($("runkm").value), sec=runDurSec();
  if(!(km>=0.1&&km<100)){ $("runerr").textContent="거리는 0.1 ~ 99.99km 사이로 입력해주세요."; return; }
  if(runBadSec()){ $("runerr").textContent="초는 59 까지입니다 — 6218 → 62:18"; return; }
  if(!(sec>0)){ $("runerr").textContent="시간을 입력해주세요."; return; }
  /* 비정상 값은 **막지 않고 한 번 더 묻는다** (SPEC 4-9 ①).
     인터벌·롱런은 실제로 범위를 벗어나므로 차단하면 정상 기록을 못 남긴다. */
  const w=runWarn(km,sec,editRunId);
  if(w&&!warnAck){
    $("runwarn").hidden=false; $("runwarn").textContent=w;
    warnAck=true; $("runsave").textContent="그대로 저장";
    return;
  }
  const old=editRunId?allRuns().find(r=>r.id===editRunId):null;
  if(editRunId&&!old){ $("runerr").textContent="그 기록을 찾지 못했습니다. 목록을 다시 열어주세요."; return; }
  // ⚠ 날짜는 언제나 원래 것이다. 수정으로 날짜가 바뀌면 주간 집계가 두 주에 걸치고
  //    월 파일까지 옮겨야 한다 — 오타는 값이지 날짜가 아니다 (4-9)
  const date=old?old.date:today(), m=monthOf(date), mo=getMonth(m);
  const hr=parseInt($("runhr").value,10), cad=parseInt($("runcad").value,10);
  // 시각은 어디에도 남기지 않는다 — id 는 날짜 + 4자리 무작위다 (SCHEMA 「시각을 저장하지 않는다」)
  const rec={id:old?old.id:newId("r",date), date, km:Math.round(km*100)/100, sec, type:runType,
             hr:hr>0?hr:null, cadence:cad>0?cad:null, note:($("runnote").value||"").trim(),
             rev:old?(old.rev||1)+1:1};      // 병합 기준은 rev 정수다 (SCHEMA)
  mo.runs=mo.runs||[];
  const back=JSON.parse(JSON.stringify(mo.runs));   // 쓰기 실패 시 되돌릴 자리
  if(old){ const i=mo.runs.findIndex(x=>x.id===old.id); if(i>=0) mo.runs[i]=rec; else mo.runs.push(rec); }
  else mo.runs.push(rec);
  mo.runs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const hadMonth=idx.months.includes(m);
  if(!hadMonth){ idx.months.push(m); idx.months.sort(); }
  if(!old) idx.counts.runs=(idx.counts.runs||0)+1;   // 수정은 개수를 늘리지 않는다
  recalcRunWeek(date);
  idx.rev++;

  const r1=await writeJSON(K.month(m),mo);
  if(!r1.ok){
    // 조용히 넘기지 않는다 (CLAUDE.md 원칙 3). 화면에만 남은 기록을 만들지 않는다
    mo.runs=back;
    if(!hadMonth) idx.months=idx.months.filter(x=>x!==m);
    if(!old) idx.counts.runs--;
    recalcRunWeek(date);
    $("runsaved").innerHTML=`<span class="err">${old?"수정":"저장"} 실패 — ${esc(r1.err||"원인 미상")}<br>기록이 바뀌지 않았습니다. 저장 공간을 확보하고 다시 시도해주세요.</span>`;
    return;
  }
  const r2=await writeJSON(K.index,idx);
  const wasEdit=!!old;
  openRunForm(false); runShown=RUN_PAGE; renderRun();
  if(r2.ok){
    $("runsaved").className="saved";
    $("runsaved").textContent=`${wasEdit?"수정됨":"저장됨"} · ${date} ${rec.km.toFixed(2)}km ${hms(sec)} ${mmss(paceOf(rec.km,sec))}/km`;
    showRunCoach(date);          // 「오늘 마무리」 — 하루를 닫고 한 번에 보내는 길 (11회차)
  }else{
    // 러닝 자체는 월 파일에 들어갔다. 못 쓴 것은 요약 캐시뿐이다 — 그 사실을 그대로 적는다
    $("runsaved").innerHTML=`<span class="err">러닝은 ${wasEdit?"수정":"저장"}됐지만 요약을 갱신하지 못했습니다 (${esc(r2.err||"원인 미상")}). 앱을 다시 열면 주간 누적이 어긋나 보일 수 있습니다.</span>`;
  }
}
/* 삭제 — 두 번 눌러야 지워진다 (4-9). 되돌릴 수 없는 조작이라 한 번에 끝내지 않는다.
   ⚠ confirm() 은 안 쓴다: 브라우저 자동화가 멈추고 iOS 모달도 손에 안 맞는다 */
async function delRun(){
  const b=$("rundel");
  if(!delArm){
    b.classList.add("arm"); b.textContent="정말 삭제 — 한 번 더";
    delArm=setTimeout(disarmDel,5000);     // 5초 뒤 저절로 풀린다. 잘못 눌러도 갇히지 않는다
    return;
  }
  disarmDel();
  const rec=allRuns().find(r=>r.id===editRunId);
  if(!rec){ $("runerr").textContent="그 기록을 찾지 못했습니다."; return; }
  const m=monthOf(rec.date), mo=getMonth(m);
  const back=JSON.parse(JSON.stringify(mo.runs||[]));
  mo.runs=(mo.runs||[]).filter(x=>x.id!==rec.id);
  idx.counts.runs=Math.max(0,(idx.counts.runs||0)-1);
  recalcRunWeek(rec.date);
  idx.rev++;
  const r1=await writeJSON(K.month(m),mo);
  if(!r1.ok){
    mo.runs=back; idx.counts.runs++; recalcRunWeek(rec.date);
    $("runsaved").innerHTML=`<span class="err">삭제 실패 — ${esc(r1.err||"원인 미상")}<br>기록은 그대로 남아 있습니다.</span>`;
    return;
  }
  const r2=await writeJSON(K.index,idx);
  openRunForm(false); renderRun();
  $("runsaved").className="saved";
  $("runsaved").textContent=r2.ok
    ? `삭제됨 · ${rec.date} ${(+rec.km).toFixed(2)}km`
    : `삭제됐지만 요약을 갱신하지 못했습니다 (${r2.err||"원인 미상"}).`;
}

/* 축 전환 — 앱을 열면 언제나 웨이트다. 선택을 저장하지 않으므로
   헬스장 동선(웨이트)의 탭 수는 1탭도 늘지 않는다 (SPEC 6단계). */
function setAxis(ax){
  document.querySelectorAll(".axis button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.ax===ax)));
  $("wtaxis").hidden=(ax!=="wt");
  $("runaxis").hidden=(ax!=="run");
  if(ax==="run"){ runShown=RUN_PAGE; renderRun(); }
  window.scrollTo({top:0,behavior:"auto"});
}
function applyRestore(text,src){
  const r=parseBackup(text||"");
  if(!r.count){ $("resmsg").innerHTML='<span class="err">읽을 수 있는 기록이 없습니다. "종목명: 20kg x 10, ..." 형식이어야 합니다.</span>'; return false; }
  /* rotation 이 Day 순환의 단일 진실이다. curDay 만 옮기고 rotation 을 두면
     앱을 다시 열었을 때 복원한 위치가 사라지고 Day 1 부터 다시 시작한다. */
  if(r.day){
    applyRotation(r.day, idx.rotation.lastDate || today());
    curDay=nextDay();
  }
  idx.rev++;
  writeJSON(K.index,idx).then(w=>{            // 결과를 확인한다 — 조용히 실패하면 안 된다
    if(!w.ok) banner(`복원한 내용을 저장하지 못했습니다 (${w.err||"원인 미상"}). 앱을 다시 열면 사라집니다 — 저장 공간을 확보하고 다시 시도해주세요.`);
  });
  renderOverview(); renderBrief(); renderBlocks(); render(); renderEditor();  // 편집기가 열려 있으면 「기록 있음」 표시도 갱신한다
  // 복원된 내용을 그대로 보여준다 — 어느 Day에 들어갔는지까지
  let html=`<div class="okline">${src} 종목 ${r.count}개 복원 완료</div>`;
  PROG().forEach(d=>{
    const hit=d.ex.filter(e=>idx.lastByExercise[e.name]);
    if(!hit.length) return;
    html+=`<div class="rgroup"><div class="rgt">DAY ${d.n} · ${esc(d.title)}</div>`
      + hit.map(e=>{ const l=idx.lastByExercise[e.name];
          return `<div class="rgi"><span>${esc(e.name)}</span><span class="rgv">${lastText(l)}${l.allTop?' <b>↑증량</b>':''}</span></div>`;
        }).join("") + `</div>`;
  });
  if(r.day) html+=`<div class="okline">화면은 다음 차례인 <b>Day ${curDay}</b>로 이동했습니다. 위 목록의 Day를 눌러 확인할 수 있습니다.</div>`;
  $("resmsg").innerHTML=html;
  return true;
}
$("clipload").addEventListener("click",async()=>{
  try{
    const t=await navigator.clipboard.readText();
    if(!t||!t.trim()){ $("resmsg").innerHTML='<span class="err">클립보드가 비어 있습니다.</span>'; return; }
    applyRestore(t,"클립보드에서");
  }catch(e){
    $("resmsg").innerHTML='<span class="err">클립보드를 읽지 못했습니다. 아래 칸에 직접 붙여넣어 주세요.</span>';
  }
});
$("resbtn").addEventListener("click",()=>{
  const t=$("restext").value||"";
  if(!t.trim()){ $("resmsg").innerHTML='<span class="err">붙여넣은 내용이 없습니다.</span>'; return; }
  applyRestore(t,"");
});
/* 서비스워커에게 캐시 버전을 물어본다. 폰에서 "고친 게 반영됐나"를 눈으로 확인하는 수단이다.
   controller 가 없으면(최초 방문·미등록) null 이고, 화면에는 그렇게 표시한다. */
function askSWVersion(){
  return new Promise(res=>{
    const c=("serviceWorker" in navigator) && navigator.serviceWorker.controller;
    if(!c) return res(null);
    const ch=new MessageChannel();
    const t=setTimeout(()=>res(null),1000);
    ch.port1.onmessage=e=>{ clearTimeout(t); res(e.data&&e.data.cache); };
    try{ c.postMessage("version",[ch.port2]); }catch(e){ clearTimeout(t); res(null); }
  });
}
/* 「진동」과 「알림음」 표시등은 뺐다 (SPEC 4-6).
   진동은 iOS 가 지원하지 않아 폰에서 늘 ○ 였고, 알림음은 하드코딩된 초록불이었는데
   소리를 포기했으므로 거짓 표시가 된다. 그 자리에 캐시 버전을 둔다. */
async function envCheck(){
  const ok=storageOK!==false;               // probeStorage() 가 실제로 대입한다 (0-2)
  const wake="wakeLock" in navigator;
  const swOn=("serviceWorker" in navigator);
  const ver=await askSWVersion();
  $("env").innerHTML=`<span class="${ok?"y":"n"}">${ok?"●":"○"} 기록 저장</span>`+
    `<span class="${wake?"y":"n"}">${wake?"●":"○"} 화면 유지</span>`+
    `<span class="${ver?"y":"n"}">${ver?"● "+ver:(swOn?"○ 오프라인 준비 중":"○ 오프라인 미지원")}</span>`+
    (ok?"":`<span class="n">저장소를 쓸 수 없는 환경입니다${lastErr?" ("+lastErr+")":""} — 세션 끝에 기록 백업을 복사해두세요</span>`);
}

(async function(){
  const d=new Date();
  $("today").textContent=`${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} (${DOW[d.getDay()]})`;
  await load();                              // load() 안에서 probeStorage() 가 먼저 돈다
  renderOverview(); renderBrief(); renderBlocks(); render(); markUnsaved(); keepAwake(); envCheck();
  bindRun();      // 러닝 목록은 축을 열 때 그린다 — 웨이트 첫 화면의 비용을 늘리지 않는다
})();

/* 서비스워커 등록 — "sw.js" 상대경로여야 한다.
   "/sw.js" 는 Pages 의 /workout/ 서브경로에서 404 가 나고, 그러면 PWA 가 아예 성립하지 않는다. */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(()=>{
      // 최초 방문에는 controller 가 없다. 잡히면 표시줄의 캐시 버전을 채운다
      if(!navigator.serviceWorker.controller){
        navigator.serviceWorker.addEventListener("controllerchange",()=>envCheck(),{once:true});
      }
    }).catch(()=>{});
  });
}
</script>
